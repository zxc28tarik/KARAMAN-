  <canvas id="game" width="1280" height="720"></canvas>
  <script>
/* ---- js/core.js ---- */
'use strict';
// Çekirdek: sabitler, yardımcılar, girdi, ses, efektler, kamera, çarpışma
window.K = window.K || {};
(function (K) {
  K.W = 1280;
  K.H = 720;
  K.GROUND = 610;
  K.GRAV = 2400;

  K.rand = (a, b) => a + Math.random() * (b - a);
  K.randi = (a, b) => Math.floor(K.rand(a, b + 1));
  K.pick = arr => arr[Math.floor(Math.random() * arr.length)];
  K.clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  K.lerp = (a, b, t) => a + (b - a) * t;
  K.approach = (v, t, d) => (v < t ? Math.min(v + d, t) : Math.max(v - d, t));
  K.sign = v => (v < 0 ? -1 : 1);
  K.overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  K.seeded = function (seed) {
    let s = seed >>> 0;
    return () => {
      s = (s * 1664525 + 1013904223) >>> 0;
      return s / 4294967296;
    };
  };

  // ---------- Girdi ----------
  const BIND = {
    left: ['KeyA', 'ArrowLeft'],
    right: ['KeyD', 'ArrowRight'],
    up: ['KeyW', 'ArrowUp'],
    down: ['KeyS', 'ArrowDown'],
    jump: ['Space'],
    attack: ['KeyJ'],
    heavy: ['KeyK'],
    ranged: ['KeyL'],
    dodge: ['ShiftLeft', 'ShiftRight'],
    swapMelee: ['KeyQ'],
    swapRanged: ['KeyE'],
    super: ['KeyF'],
    pause: ['Escape', 'KeyP'],
    confirm: ['Enter'],
  };
  const down = {}, pressed = {}, released = {};
  const GAME_KEYS = new Set(Object.values(BIND).flat());
  addEventListener('keydown', e => {
    if (GAME_KEYS.has(e.code)) e.preventDefault();
    if (!down[e.code]) pressed[e.code] = true;
    down[e.code] = true;
    K.audio.unlock();
  });
  addEventListener('keyup', e => {
    down[e.code] = false;
    released[e.code] = true;
  });
  addEventListener('blur', () => {
    for (const k in down) down[k] = false;
  });
  K.input = {
    held: a => BIND[a].some(c => down[c]),
    hit: a => BIND[a].some(c => pressed[c]),
    up: a => BIND[a].some(c => released[c]),
    endFrame() {
      for (const k in pressed) delete pressed[k];
      for (const k in released) delete released[k];
    },
  };

  // ---------- Ses (WebAudio ile üretilen kısa efektler) ----------
  K.audio = {
    ctx: null,
    unlock() {
      if (!this.ctx) {
        try {
          this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        } catch (e) {
          this.ctx = null;
        }
      }
      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    },
  };
  let noiseBuf = null;
  function noise(ctx) {
    if (noiseBuf) return noiseBuf;
    const b = ctx.createBuffer(1, ctx.sampleRate * 0.6, ctx.sampleRate);
    const d = b.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    return (noiseBuf = b);
  }
  const SFX = {
    swing: { n: 1, f: 2200, q: 1.4, ft: 'bandpass', d: 0.1, v: 0.1 },
    hit: { n: 1, f: 1100, d: 0.12, v: 0.32, tone: 160 },
    heavy: { n: 1, f: 600, d: 0.24, v: 0.5, tone: 90 },
    shot: { n: 1, f: 1400, d: 0.4, v: 0.55, tone: 70 },
    bow: { tone: 520, sweep: 160, d: 0.12, v: 0.14, wave: 'triangle' },
    throw: { n: 1, f: 900, q: 1, ft: 'bandpass', d: 0.18, v: 0.14 },
    hurt: { tone: 220, sweep: 90, d: 0.2, v: 0.2, wave: 'square' },
    clang: { tone: 1500, sweep: 900, d: 0.25, v: 0.16, wave: 'triangle' },
    break: { n: 1, f: 3200, d: 0.5, v: 0.4, tone: 340, sweep: 60, wave: 'sawtooth' },
    boom: { n: 1, f: 260, d: 0.7, v: 0.7, tone: 55 },
    ui: { tone: 660, sweep: 880, d: 0.09, v: 0.1 },
    jump: { tone: 300, sweep: 520, d: 0.08, v: 0.06 },
    dash: { n: 1, f: 1600, q: 0.8, ft: 'bandpass', d: 0.16, v: 0.12 },
    horn: { tone: 180, sweep: 240, d: 0.9, v: 0.12, wave: 'sawtooth' },
  };
  const lastPlay = {};
  K.sfx = function (type, vol = 1) {
    const ctx = K.audio.ctx;
    const P = SFX[type];
    if (!ctx || !P) return;
    const now = performance.now();
    if (lastPlay[type] && now - lastPlay[type] < 28) return;
    lastPlay[type] = now;
    const t = ctx.currentTime;
    const g = ctx.createGain();
    g.connect(ctx.destination);
    const v = P.v * vol * 0.8;
    g.gain.setValueAtTime(v, t);
    g.gain.exponentialRampToValueAtTime(0.0008, t + P.d);
    if (P.n) {
      const s = ctx.createBufferSource();
      s.buffer = noise(ctx);
      const f = ctx.createBiquadFilter();
      f.type = P.ft || 'lowpass';
      f.frequency.value = P.f;
      if (P.q) f.Q.value = P.q;
      s.connect(f);
      f.connect(g);
      s.start(t);
      s.stop(t + P.d);
    }
    if (P.tone) {
      const o = ctx.createOscillator();
      o.type = P.wave || 'sine';
      o.frequency.setValueAtTime(P.tone, t);
      o.frequency.exponentialRampToValueAtTime(P.sweep || Math.max(30, P.tone * 0.5), t + P.d);
      const og = ctx.createGain();
      og.gain.value = 0.6;
      o.connect(og);
      og.connect(g);
      o.start(t);
      o.stop(t + P.d);
    }
  };

  // ---------- Efektler ----------
  K.fx = {
    list: [],
    add(p) {
      const o = Object.assign({ life: 0.5, vx: 0, vy: 0, grav: 0, size: 3, color: '#fff', type: 'dot', drag: 0 }, p);
      o.max = o.life;
      this.list.push(o);
      return o;
    },
    update(dt) {
      for (const p of this.list) {
        p.life -= dt;
        p.vy += p.grav * dt;
        if (p.drag) {
          p.vx *= Math.max(0, 1 - p.drag * dt);
          p.vy *= Math.max(0, 1 - p.drag * dt);
        }
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        if (p.type === 'dot' && p.grav > 0 && p.y > K.GROUND + 4) {
          if (!p.landed && p.blood) {
            p.landed = true;
            this.decals.push({ x: p.x, dy: K.rand(-2, 10), r: K.rand(2, 6), c: K.pick(['rgba(70,6,8,0.85)', 'rgba(96,10,12,0.8)', 'rgba(50,4,6,0.9)']) });
            if (this.decals.length > 260) this.decals.shift();
          }
          p.y = K.GROUND + 4;
          p.vy *= -0.25;
          p.vx *= 0.5;
        }
      }
      this.list = this.list.filter(p => p.life > 0);
      if (this.list.length > 1200) this.list.splice(0, this.list.length - 1200);
    },
    draw(ctx, only) {
      for (const p of this.list) {
        if (only === 'text' && p.type !== 'text') continue;
        if (only === 'world' && p.type === 'text') continue;
        const a = K.clamp(p.life / p.max, 0, 1);
        ctx.globalAlpha = p.type === 'text' ? Math.min(1, a * 2) : a;
        switch (p.type) {
          case 'dot':
            ctx.fillStyle = p.color;
            ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
            break;
          case 'spark':
            ctx.strokeStyle = p.color;
            ctx.lineWidth = p.size;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(p.x, p.y);
            ctx.lineTo(p.x - p.vx * 0.035, p.y - p.vy * 0.035);
            ctx.stroke();
            break;
          case 'smoke':
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size * (1.8 - a * 0.8), 0, Math.PI * 2);
            ctx.fill();
            break;
          case 'ring': {
            const r = p.size * (1 - a) + 12;
            ctx.strokeStyle = p.color;
            ctx.lineWidth = 5 * a + 1;
            ctx.beginPath();
            ctx.ellipse(p.x, p.y, r, r * (p.flat || 0.28), 0, 0, Math.PI * 2);
            ctx.stroke();
            break;
          }
          case 'arc': {
            // Kılıç izi: p.a0 -> p.a1 arası yay
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.scale(p.dir, 1);
            ctx.strokeStyle = p.color;
            ctx.lineCap = 'round';
            for (let i = 0; i < 3; i++) {
              ctx.globalAlpha = a * (0.8 - i * 0.22);
              ctx.lineWidth = (p.width || 10) * (1 - i * 0.3) * a;
              ctx.beginPath();
              const rr = p.r - i * 7;
              if (p.a1 > p.a0) ctx.arc(0, 0, rr, p.a0, p.a1, false);
              else ctx.arc(0, 0, rr, p.a1, p.a0, false);
              ctx.stroke();
            }
            ctx.restore();
            break;
          }
          case 'line':
            ctx.strokeStyle = p.color;
            ctx.lineWidth = (p.size || 6) * a;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(p.x, p.y);
            ctx.lineTo(p.x2, p.y2);
            ctx.stroke();
            break;
          case 'ghost':
            if (p.drawFn) p.drawFn(ctx, a);
            break;
          case 'text':
            ctx.font = `bold ${p.size}px Georgia, serif`;
            ctx.textAlign = 'center';
            ctx.lineWidth = 4;
            ctx.strokeStyle = 'rgba(0,0,0,0.85)';
            ctx.strokeText(p.text, p.x, p.y);
            ctx.fillStyle = p.color;
            ctx.fillText(p.text, p.x, p.y);
            break;
        }
      }
      ctx.globalAlpha = 1;
    },
    sparks(x, y, dir, n = 8, color = '#ffe08a', spd = 600) {
      for (let i = 0; i < n; i++) {
        const a = (dir > 0 ? 0 : Math.PI) + K.rand(-0.9, 0.9);
        const s = K.rand(spd * 0.4, spd);
        this.add({ type: 'spark', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 80, grav: 900, life: K.rand(0.15, 0.32), size: 2, color });
      }
    },
    blood(x, y, dir, n = 8) {
      for (let i = 0; i < n; i++) {
        this.add({ type: 'dot', blood: true, x, y, vx: dir * K.rand(80, 460), vy: K.rand(-460, -60), grav: 1500, life: K.rand(0.5, 1.0), size: K.rand(2.5, 6), color: K.pick(['#7a1010', '#9a1a18', '#5a0a0a']) });
      }
    },
    dust(x, y, n = 6, spread = 1) {
      for (let i = 0; i < n; i++) {
        this.add({ type: 'smoke', x: x + K.rand(-10, 10) * spread, y: y - 4, vx: K.rand(-120, 120) * spread, vy: K.rand(-60, -10), drag: 3, life: K.rand(0.3, 0.6), size: K.rand(5, 10), color: 'rgba(170,150,125,0.55)' });
      }
    },
    smoke(x, y, dir, n = 10) {
      for (let i = 0; i < n; i++) {
        this.add({ type: 'smoke', x, y, vx: dir * K.rand(40, 260), vy: K.rand(-80, 20), drag: 2.4, life: K.rand(0.5, 1.1), size: K.rand(6, 13), color: 'rgba(210,205,195,0.5)' });
      }
    },
    spray(x, y, dir, n = 12, power = 1) {
      for (let i = 0; i < n; i++) {
        const a = (dir > 0 ? 0 : Math.PI) + K.rand(-0.7, 0.5) * (dir > 0 ? 1 : -1);
        const s = K.rand(250, 750) * power;
        this.add({ type: 'spark', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 120, grav: 1100, life: K.rand(0.25, 0.55), size: K.rand(2.5, 4.5), color: K.pick(['#6a0808', '#8e1010', '#a81c16']) });
      }
      for (let i = 0; i < n * 0.6; i++) {
        this.add({ type: 'smoke', x: x + K.rand(-6, 6), y: y + K.rand(-6, 6), vx: dir * K.rand(40, 160), vy: K.rand(-60, 20), drag: 3, life: K.rand(0.3, 0.6), size: K.rand(3, 6), color: 'rgba(120,10,12,0.55)' });
      }
    },
    decals: [],
    drawDecals(ctx) {
      for (const d of this.decals) {
        ctx.fillStyle = d.c;
        ctx.beginPath();
        ctx.ellipse(d.x, K.GROUND + 3 + d.dy, d.r, d.r * 0.3, 0, 0, Math.PI * 2);
        ctx.fill();
      }
    },
    number(x, y, val, color = '#ffe9a8', size = 18) {
      this.add({ type: 'text', text: String(Math.round(val)), x: x + K.rand(-12, 12), y, vy: -90, drag: 2, life: 0.7, size, color });
    },
    text(x, y, text, color = '#fff', size = 22, life = 1) {
      this.add({ type: 'text', text, x, y, vy: -40, drag: 1, life, size, color });
    },
  };

  // ---------- Kamera ----------
  K.cam = {
    x: 0,
    shakeT: 0,
    shakeMag: 0,
    ox: 0,
    oy: 0,
    shake(mag, t) {
      if (mag >= this.shakeMag || this.shakeT <= 0) this.shakeMag = mag;
      this.shakeT = Math.max(this.shakeT, t);
    },
    update(dt, focusX, minX, maxX) {
      let tx = focusX - K.W / 2;
      tx = K.clamp(tx, minX, Math.max(minX, maxX - K.W));
      this.x = K.lerp(this.x, tx, 1 - Math.pow(0.002, dt));
      if (this.shakeT > 0) {
        this.shakeT -= dt;
        this.ox = K.rand(-1, 1) * this.shakeMag;
        this.oy = K.rand(-1, 1) * this.shakeMag * 0.6;
        if (this.shakeT <= 0) this.shakeMag = 0;
      } else {
        this.ox = this.oy = 0;
      }
    },
  };

  // ---------- Çarpışma ----------
  // Saldırı dikdörtgeninin karşı takımdaki hedeflere değmesi; her hedef bir saldırıda bir kez vurulur.
  K.strike = function (team, rect, p, hitSet) {
    const G = K.game;
    const targets = team === 'player' ? G.enemies : [G.player];
    let n = 0;
    for (const t of targets) {
      if (!t || t.dead || hitSet.has(t)) continue;
      if (!K.overlap(rect, t.hurtbox())) continue;
      hitSet.add(t);
      const r = t.takeHit(p);
      if (r) {
        n++;
        if (p.onHit) p.onHit(t, r);
      }
    }
    return n;
  };
})(window.K);

</script>

// Karamani görsel dosyaları ayarı.
// Bir resim eklemek için dosyayı assets/ altına koy ve burada tanımla. Boş bırakılan her şey

  backgrounds: {

  <script>
/* ---- js/assets.js ---- */
'use strict';
// assets/assets.js içindeki resimleri yükler; arka plan katmanlarını ve karakter parçalarını hazırlar.
(function (K) {
  const CFG = window.KARAMANI_ASSETS || { backgrounds: {}, characters: {} };
  const imgs = [];
  function load(src) {
    const im = new Image();
    im.src = src;
    im.onerror = () => console.warn('Görsel yüklenemedi:', src);
    imgs.push(im);
    return im;
  }
  const ok = im => !!im && (im instanceof HTMLCanvasElement || (im.complete && im.naturalWidth > 0));

  const bg = {};
  for (const d in CFG.backgrounds || {}) bg[d] = (CFG.backgrounds[d] || []).map(l => Object.assign({}, l, { img: load(l.src) }));

  const prep = p => Object.assign({}, p, { img: load(p.src) });
  const chars = {};
  for (const name in CFG.characters || {}) {
    const c = CFG.characters[name];
    chars[name] = { parts: {}, weapons: {} };
    for (const k in c.parts || {}) chars[name].parts[k] = prep(c.parts[k]);
    for (const k in c.weapons || {}) chars[name].weapons[k] = prep(c.weapons[k]);
  }

  K.assets = {
    // Bu semtin resimli katmanları hazır mı?
    bgLayers(district) {
      const L = bg[district];
      return L && L.length && L.every(l => ok(l.img)) ? L : null;
    },
    // Karakterin parça seti (bütün parçalar yüklendiyse)
    charParts(name) {
      const c = chars[name];
      if (!c) return null;
      const all = Object.values(c.parts);
      return all.length && all.every(p => ok(p.img)) ? c : null;
    },
    // Bir parçayı iki eklem noktası arasına yerleştirip çizer
    drawPart(ctx, p, ax, ay, bx, by, stretch = true) {
      if (!p || !ok(p.img)) return false;
      const [pax, pay] = p.a, [pbx, pby] = p.b;
      const lenImg = Math.hypot(pbx - pax, pby - pay) || 1;
      const lenRig = Math.hypot(bx - ax, by - ay) || 1;
      const s = stretch ? lenRig / lenImg : p.scale || 1;
      const rot = Math.atan2(by - ay, bx - ax) - Math.atan2(pby - pay, pbx - pax);
      ctx.save();
      ctx.translate(ax, ay);
      ctx.rotate(rot);
      ctx.scale(s, s);
      ctx.drawImage(p.img, -pax, -pay);
      ctx.restore();
      return true;
    },
    // Test ve ayar için: bir karaktere çalışma anında parça ata
    setChar(name, parts, weapons = {}) {
      chars[name] = { parts, weapons };
    },
    hasUser(name) {
      return !!(CFG.characters && CFG.characters[name]);
    },
    setBg(district, layers) {
      bg[district] = layers;
    },
  };
})(window.K);

  <script>
/* ---- js/draw.js ---- */
'use strict';
// Çizim: karakter iskeleti, silahlar, arka plan
(function (K) {
  // ---------- Renk yardımcıları ----------
  function shade(hex, f) {
    const n = parseInt(hex.slice(1), 16);
    let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    r = Math.round(K.clamp(r * f, 0, 255));
    g = Math.round(K.clamp(g * f, 0, 255));
    b = Math.round(K.clamp(b * f, 0, 255));
    return '#' + ((1 << 24) | (r << 16) | (g << 8) | b).toString(16).slice(1);
  }
  K.shade = shade;

  // Görünüm tanımları; eksik koyu tonlar otomatik üretilir
  K.LOOKS = {};
  K.defineLook = function (name, o) {
    const L = Object.assign({ scale: 1, skin: '#b88462', beard: null, mustache: '#2b1f17', hat: 'janissary', coat: '#2f4f8f', trim: '#d9c08a', sash: '#b23a2a', pants: '#7a2a2a', boots: '#3b2a1e', mail: false, hatColor: '#efe9dc' }, o);
    for (const k of ['skin', 'coat', 'pants', 'boots']) L[k + 'Dark'] = L[k + 'Dark'] || shade(L[k], 0.72);
    L.partsName = name;
    K.LOOKS[name] = L;
    return L;
  };

  // İskelet ölçüleri (birim): uyluk, baldır, gövde, üst kol, alt kol
  K.RIG = { TH: 30, SN: 31, TR: 44, UA: 22, FA: 21 };

  // ---------- Pozlar ----------
  const DEF = { lean: 0.05, bob: 0, ft: 0.2, fs: 0.05, bt: -0.2, bs: -0.28, au: 0.35, af: 1.0, bu: -0.15, bf: 0.25, wa: -0.7, wb: -0.7, head: 0, rot: 0, draw: 0 };
  K.pose = o => Object.assign({}, DEF, o);
  K.lerpPose = function (a, b, t) {
    const o = {};
    for (const k in DEF) o[k] = K.lerp(a[k] ?? DEF[k], b[k] ?? DEF[k], t);
    return o;
  };
  K.runPose = function (phase, base) {
    const s = Math.sin(phase);
    const p = Object.assign({}, base);
    p.ft = s * 0.85;
    p.fs = p.ft - 0.15 - 0.85 * Math.max(0, -Math.cos(phase));
    p.bt = -s * 0.85;
    p.bs = p.bt - 0.15 - 0.85 * Math.max(0, Math.cos(phase));
    p.bob = -Math.abs(Math.cos(phase)) * 5;
    p.lean = (base.lean || 0) + 0.18;
    p.bu = -s * 0.7;
    p.bf = p.bu + 0.7;
    return p;
  };

  // ---------- İskelet ----------
  function limbPts(x, y, a1, a2, l1, l2) {
    const kx = x + Math.sin(a1) * l1, ky = y + Math.cos(a1) * l1;
    return [kx, ky, kx + Math.sin(a2) * l2, ky + Math.cos(a2) * l2];
  }
  function ik(sx, sy, tx, ty, l1, l2, bend) {
    const dx = tx - sx, dy = ty - sy;
    let d = Math.hypot(dx, dy);
    d = K.clamp(d, Math.abs(l1 - l2) + 0.5, l1 + l2 - 0.5);
    const a = Math.atan2(dy, dx);
    const b = Math.acos(K.clamp((l1 * l1 + d * d - l2 * l2) / (2 * l1 * d), -1, 1));
    const ea = a + bend * b;
    return [sx + Math.cos(ea) * l1, sy + Math.sin(ea) * l1, sx + Math.cos(a) * d, sy + Math.sin(a) * d];
  }
  function stroke2(ctx, x, y, kx, ky, fx, fy, w, color) {
    ctx.strokeStyle = color;
    ctx.lineWidth = w;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(kx, ky);
    ctx.lineTo(fx, fy);
    ctx.stroke();
  }
  const TWO_HAND = { mizrak: 1, tufek: 1, bayrak: 1 };

  // x,y = ayak noktası (dünya)
  K.drawRig = function (ctx, x, y, facing, pose, look, weapon, flash, extra) {
    const c = k => (flash ? '#fff4e8' : look[k]);
    extra = extra || {};
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(facing * look.scale, look.scale);
    if (pose.rot) {
      ctx.translate(0, -26);
      ctx.rotate(pose.rot);
      ctx.translate(0, 26);
    }
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    const { TH, SN, TR, UA, FA } = K.RIG;
    const hipY = -(TH + SN) + (pose.bob || 0);
    const lean = pose.lean || 0;
    const shX = Math.sin(lean) * TR, shY = hipY - Math.cos(lean) * TR;

    // Ön kol ve silah noktaları önceden hesaplanır (iki elli silahlar için)
    const fa = limbPts(shX + 3, shY + 4, pose.au, pose.af, UA, FA);
    const hx = fa[2], hy = fa[3];
    const wdx = Math.cos(pose.wa), wdy = Math.sin(pose.wa);
    let back;
    if (weapon && TWO_HAND[weapon]) {
      back = ik(shX - 3, shY + 4, hx - wdx * 30, hy - wdy * 30, UA, FA, 1);
    } else if (weapon === 'yay') {
      const pull = 8 + 42 * (pose.draw || 0);
      back = ik(shX - 3, shY + 4, hx - wdx * pull, hy - wdy * pull, UA, FA, 1);
    } else {
      back = limbPts(shX - 3, shY + 4, pose.bu, pose.bf, UA, FA);
    }

    // Resim parçalı karakter varsa onu çiz
    const parts = K.assets && K.assets.charParts(look.partsName);
    if (parts) {
      const bl = limbPts(-4, hipY, pose.bt, pose.bs, TH, SN), fl = limbPts(4, hipY, pose.ft, pose.fs, TH, SN);
      drawParts(ctx, parts, { hipY, shX, shY, lean, fa, hx, hy, back, bl, fl }, pose, weapon, extra, look);
      ctx.restore();
      return;
    }

    // Pelerin: hıza göre arkaya savrulur, ucu dalgalanır
    if (look.cape && extra.cape) {
      const v = extra.cape.v || 0, t = extra.cape.t || 0;
      const wave = Math.sin(t * (6 + v * 6)) * (2 + v * 5);
      const len = look.capeLen || 62;
      const bx = shX - 24 - v * 34 + wave * 0.6, by = shY + len - v * 22 + wave;
      ctx.fillStyle = c('cape');
      ctx.beginPath();
      ctx.moveTo(shX + 4, shY + 1);
      ctx.lineTo(shX - 10, shY);
      ctx.quadraticCurveTo(shX - 22 - v * 18, shY + len * 0.45 + wave * 0.5, bx, by);
      ctx.lineTo(bx + 9, by + 4 - wave * 0.4);
      ctx.lineTo(bx + 17, by + 1);
      ctx.quadraticCurveTo(-6, hipY + 18, 2, hipY + 6);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = c('capeLining');
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(shX - 10, shY);
      ctx.quadraticCurveTo(shX - 22 - v * 18, shY + len * 0.45 + wave * 0.5, bx, by);
      ctx.stroke();
      if (look.capeFur) {
        ctx.fillStyle = c('capeFur');
        ctx.beginPath();
        ctx.ellipse(shX - 3, shY + 3, 15, 7, 0, 0, 7);
        ctx.fill();
      }
    }

    // Arka kol
    stroke2(ctx, shX - 3, shY + 4, back[0], back[1], back[2], back[3], 9.5, c('coatDark'));
    if (extra.offhand) K.drawWeapon(ctx, extra.offhand, back[2], back[3], pose.wb, flash);
    ctx.fillStyle = c('skinDark');
    ctx.beginPath();
    ctx.arc(back[2], back[3], 4, 0, 7);
    ctx.fill();

    // Bacaklar
    const bl = limbPts(-4, hipY, pose.bt, pose.bs, TH, SN);
    stroke2(ctx, -4, hipY, bl[0], bl[1], bl[2], bl[3], 11.5, c('pantsDark'));
    ctx.fillStyle = c('bootsDark');
    ctx.fillRect(bl[2] - 4, bl[3] - 5, 14, 8);
    const fl = limbPts(4, hipY, pose.ft, pose.fs, TH, SN);
    stroke2(ctx, 4, hipY, fl[0], fl[1], fl[2], fl[3], 11.5, c('pants'));
    ctx.fillStyle = c('boots');
    ctx.fillRect(fl[2] - 4, fl[3] - 5, 14, 8);

    // Kaftan eteği
    const hemY = hipY + 30;
    const frontX = Math.max(fl[0], bl[0], 12) + 6;
    const backX = Math.min(fl[0], bl[0], -12) - 6;
    ctx.fillStyle = c('coat');
    ctx.beginPath();
    ctx.moveTo(-12, hipY - 8);
    ctx.lineTo(12, hipY - 8);
    ctx.lineTo(frontX, hemY);
    ctx.quadraticCurveTo((frontX + backX) / 2, hemY + 5, backX, hemY);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = c('trim');
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(frontX, hemY);
    ctx.quadraticCurveTo((frontX + backX) / 2, hemY + 5, backX, hemY);
    ctx.stroke();

    // Gövde
    ctx.fillStyle = c('coat');
    ctx.beginPath();
    ctx.moveTo(-12, hipY - 4);
    ctx.lineTo(12, hipY - 4);
    ctx.lineTo(shX + 16, shY + 2);
    ctx.quadraticCurveTo(shX, shY - 5, shX - 15, shY + 2);
    ctx.closePath();
    ctx.fill();
    if (look.mail) {
      ctx.fillStyle = flash ? '#fff' : '#8d949b';
      ctx.beginPath();
      ctx.moveTo(shX + 2, shY + 2);
      ctx.lineTo(shX + 11, shY + 4);
      ctx.lineTo(9, hipY - 8);
      ctx.lineTo(2, hipY - 8);
      ctx.closePath();
      ctx.fill();
      if (!flash) {
        ctx.strokeStyle = '#6b7178';
        ctx.lineWidth = 1;
        for (let i = 1; i < 5; i++) {
          const t = i / 5;
          ctx.beginPath();
          ctx.moveTo(K.lerp(shX + 2, 2, t), K.lerp(shY + 3, hipY - 8, t));
          ctx.lineTo(K.lerp(shX + 11, 9, t), K.lerp(shY + 4, hipY - 8, t));
          ctx.stroke();
        }
      }
    }
    ctx.strokeStyle = c('trim');
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(shX + 2, shY + 2);
    ctx.lineTo(2, hipY - 6);
    ctx.stroke();
    // Kuşak
    const wx = K.lerp(0, shX, 0.12), wy = K.lerp(hipY, shY, 0.12);
    ctx.fillStyle = c('sash');
    ctx.save();
    ctx.translate(wx, wy);
    ctx.rotate(lean);
    ctx.fillRect(-13, -5, 26, 9);
    ctx.restore();
    if (look.shield && !flash) {
      // Kalkan arka koldadır, gövdenin önünde durur
    }

    // Baş
    const headX = shX + Math.sin(lean) * 12, headY = shY - 12;
    ctx.save();
    ctx.translate(headX, headY);
    ctx.rotate(pose.head || 0);
    ctx.fillStyle = c('skin');
    ctx.fillRect(-4, 4, 8, 7);
    ctx.beginPath();
    ctx.arc(0, 0, 10, 0, 7);
    ctx.fill();
    if (look.beard) {
      ctx.fillStyle = c('beard');
      ctx.beginPath();
      ctx.moveTo(-5, 3);
      ctx.quadraticCurveTo(-2, 16, 8, 13);
      ctx.quadraticCurveTo(11, 6, 10, 2);
      ctx.closePath();
      ctx.fill();
      if (look.beardGray && !flash) {
        ctx.strokeStyle = '#9a948c';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(0, 8);
        ctx.lineTo(4, 12);
        ctx.stroke();
      }
    }
    if (look.mustache) {
      ctx.strokeStyle = c('mustache');
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(10, 3);
      ctx.quadraticCurveTo(6, 6, 2, 7);
      ctx.stroke();
    }
    if (extra.eyeGlow) {
      ctx.fillStyle = `rgba(255,${60 - extra.eyeGlow * 30},40,${0.6 + extra.eyeGlow * 0.4})`;
      ctx.fillRect(3.5, -4.5, 6, 4);
    } else {
      ctx.fillStyle = flash ? '#fff' : '#1a120d';
      ctx.fillRect(5, -3, 2.5, 2.5);
    }
    ctx.fillRect(3, -6, 6, 1.5);
    drawHat(ctx, look, flash);
    ctx.restore();

    // Kalkan (ön tarafta)
    if (look.shield) {
      const sx = K.lerp(fa[0], hx, 0.5), sy = K.lerp(fa[1], hy, 0.5);
      ctx.fillStyle = flash ? '#fff' : '#7a5a32';
      ctx.beginPath();
      ctx.arc(sx + 4, sy, 17, 0, 7);
      ctx.fill();
      ctx.strokeStyle = flash ? '#fff' : '#c9a24a';
      ctx.lineWidth = 3;
      ctx.stroke();
      ctx.fillStyle = flash ? '#fff' : '#c9a24a';
      ctx.beginPath();
      ctx.arc(sx + 4, sy, 4, 0, 7);
      ctx.fill();
    }

    // Ön kol + silah
    if (weapon) K.drawWeapon(ctx, weapon, hx, hy, pose.wa, flash, pose);
    stroke2(ctx, shX + 3, shY + 4, fa[0], fa[1], hx, hy, 9.5, c('coat'));
    ctx.fillStyle = c('skin');
    ctx.beginPath();
    ctx.arc(hx, hy, 4.2, 0, 7);
    ctx.fill();
    if (extra.glint) {
      const gx = hx + wdx * (extra.glintLen || 55), gy = hy + wdy * (extra.glintLen || 55);
      ctx.fillStyle = 'rgba(255,240,180,' + extra.glint + ')';
      ctx.beginPath();
      ctx.arc(gx, gy, 9 * extra.glint + 3, 0, 7);
      ctx.fill();
    }
    ctx.restore();
  };

  // Silah ucunun eldeki kabzaya uzaklığı (iskelet birimi)
  const TIP = { kilic: 68, yatagan: 52, mizrak: 124, bayrak: 124, tufek: 86, tabanca: 28, cirit: 76, topuz: 69 };
  function drawParts(ctx, C, g, pose, weapon, extra, look) {
    const A = K.assets, P = C.parts;
    const d = (k, ax, ay, bx, by) => P[k] && A.drawPart(ctx, P[k], ax, ay, bx, by);
    const wpn = (kind, hx, hy, ang) => {
      if (!kind) return;
      const p = C.weapons[kind];
      if (!p) return K.drawWeapon(ctx, kind, hx, hy, ang, false, pose);
      if (kind === 'yay') return A.drawPart(ctx, p, hx, hy, hx + Math.cos(ang - Math.PI / 2) * 40, hy + Math.sin(ang - Math.PI / 2) * 40);
      const L = TIP[kind] || 60;
      A.drawPart(ctx, p, hx, hy, hx + Math.cos(ang) * L, hy + Math.sin(ang) * L);
    };
    if (P.cape && extra.cape) {
      const v = extra.cape.v || 0, t = extra.cape.t || 0;
      const wave = Math.sin(t * (6 + v * 6)) * (2 + v * 5);
      const len = look.capeLen || 62;
      d('cape', g.shX - 6, g.shY, g.shX - 24 - v * 34 + wave * 0.6 + 8, g.shY + len - v * 22 + wave);
    }
    d('upperArmB', g.shX - 3, g.shY + 4, g.back[0], g.back[1]);
    d('foreArmB', g.back[0], g.back[1], g.back[2], g.back[3]);
    if (extra.offhand) wpn(extra.offhand, g.back[2], g.back[3], pose.wb);
    d('thighB', -4, g.hipY, g.bl[0], g.bl[1]);
    d('shinB', g.bl[0], g.bl[1], g.bl[2], g.bl[3]);
    d('thighF', 4, g.hipY, g.fl[0], g.fl[1]);
    d('shinF', g.fl[0], g.fl[1], g.fl[2], g.fl[3]);
    d('skirt', 0, g.hipY - 8, (g.fl[0] + g.bl[0]) / 2, g.hipY + 34);
    d('torso', 0, g.hipY, g.shX, g.shY);
    const ang = g.lean + (pose.head || 0);
    const hX = g.shX + Math.sin(g.lean) * 12, hY = g.shY - 12;
    d('head', hX - Math.sin(ang) * 10, hY + Math.cos(ang) * 10, hX + Math.sin(ang) * 10, hY - Math.cos(ang) * 10);
    if (extra.eyeGlow) {
      const ex = hX + Math.cos(ang) * 6.4 + Math.sin(ang) * 2.3, ey = hY + Math.sin(ang) * 6.4 - Math.cos(ang) * 2.3;
      const k = extra.eyeGlow;
      const gl = ctx.createRadialGradient(ex, ey, 0.3, ex, ey, 5);
      gl.addColorStop(0, `rgba(255,${200 - k * 120},120,${0.7 + k * 0.3})`);
      gl.addColorStop(0.35, `rgba(255,40,30,${0.5 + k * 0.4})`);
      gl.addColorStop(1, 'rgba(255,0,0,0)');
      ctx.fillStyle = gl;
      ctx.fillRect(ex - 5, ey - 5, 10, 10);
    }
    if (P.shield) {
      const mx = (g.fa[0] + g.hx) / 2 + 4, my = (g.fa[1] + g.hy) / 2;
      A.drawPart(ctx, P.shield, mx, my, mx, my + 17, false);
    }
    wpn(weapon, g.hx, g.hy, pose.wa);
    d('upperArmF', g.shX + 3, g.shY + 4, g.fa[0], g.fa[1]);
    d('foreArmF', g.fa[0], g.fa[1], g.hx, g.hy);
    if (extra.glint) {
      const L = extra.glintLen || 55;
      const gx = g.hx + Math.cos(pose.wa) * L, gy = g.hy + Math.sin(pose.wa) * L;
      const gl = ctx.createRadialGradient(gx, gy, 0.5, gx, gy, 12 * extra.glint + 4);
      gl.addColorStop(0, `rgba(255,250,220,${extra.glint})`);
      gl.addColorStop(1, 'rgba(255,220,150,0)');
      ctx.fillStyle = gl;
      ctx.fillRect(gx - 20, gy - 20, 40, 40);
    }
  }

  function drawHat(ctx, look, flash) {
    const hc = flash ? '#fff' : look.hatColor;
    switch (look.hat) {
      case 'akinci': {
        // Kürk börk ve turna tüyü
        ctx.fillStyle = flash ? '#fff' : '#5b4030';
        ctx.beginPath();
        ctx.ellipse(-1, -9, 12.5, 9, 0, Math.PI, 0);
        ctx.fill();
        ctx.fillRect(-13.5, -10, 26, 5);
        ctx.fillStyle = flash ? '#fff' : '#7a5a42';
        for (let i = -11; i < 12; i += 4) ctx.fillRect(i, -12, 2, 3);
        ctx.fillStyle = flash ? '#fff' : '#a8262b';
        ctx.fillRect(-12, -7, 24, 3);
        ctx.strokeStyle = flash ? '#fff' : '#e9e4da';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(-6, -16);
        ctx.quadraticCurveTo(-12, -30, -22, -38);
        ctx.stroke();
        ctx.strokeStyle = flash ? '#fff' : '#2a2a2a';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(-17, -33);
        ctx.lineTo(-22, -38);
        ctx.stroke();
        break;
      }
      case 'janissary': {
        // Yeniçeri börkü: dik keçe, arkaya sarkan yatırtma
        ctx.fillStyle = hc;
        ctx.beginPath();
        ctx.moveTo(-10, -6);
        ctx.lineTo(8, -6);
        ctx.lineTo(4, -30);
        ctx.quadraticCurveTo(-4, -38, -14, -30);
        ctx.quadraticCurveTo(-24, -10, -26, 18);
        ctx.lineTo(-18, 20);
        ctx.quadraticCurveTo(-16, 0, -10, -6);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = flash ? '#fff' : '#b9b09d';
        ctx.lineWidth = 1.2;
        ctx.stroke();
        ctx.fillStyle = flash ? '#fff' : '#c9a24a';
        ctx.fillRect(-11, -9, 20, 4);
        ctx.fillRect(1, -22, 4, 13);
        break;
      }
      case 'aga': {
        ctx.fillStyle = hc;
        ctx.beginPath();
        ctx.ellipse(0, -16, 15, 16, 0, Math.PI, 0);
        ctx.fill();
        ctx.fillRect(-15, -17, 30, 10);
        ctx.strokeStyle = flash ? '#fff' : '#b9b09d';
        ctx.lineWidth = 1.2;
        for (let i = -12; i < 14; i += 6) {
          ctx.beginPath();
          ctx.moveTo(i, -8);
          ctx.quadraticCurveTo(i + 3, -20, i, -30);
          ctx.stroke();
        }
        ctx.fillStyle = flash ? '#fff' : '#c9a24a';
        ctx.fillRect(-3, -24, 6, 10);
        // Sorguç
        ctx.strokeStyle = flash ? '#fff' : '#f2efe8';
        ctx.lineWidth = 4;
        for (const [dx, h] of [[-4, -58], [0, -64], [4, -56]]) {
          ctx.beginPath();
          ctx.moveTo(0, -24);
          ctx.quadraticCurveTo(dx * 2, -40, dx * 4, h);
          ctx.stroke();
        }
        break;
      }
      case 'kavuk': {
        ctx.fillStyle = hc;
        ctx.beginPath();
        ctx.ellipse(0, -10, 12, 10, 0, Math.PI, 0);
        ctx.fill();
        ctx.fillStyle = flash ? '#fff' : '#a8262b';
        ctx.fillRect(-3, -24, 6, 10);
        ctx.fillStyle = flash ? '#fff' : '#efe9dc';
        ctx.fillRect(-13, -11, 26, 6);
        break;
      }
    }
  }

  // ---------- Silahlar (el noktasında, açıyla) ----------
  K.drawWeapon = function (ctx, kind, hx, hy, ang, flash, pose) {
    const metal = flash ? '#fff' : '#dfe6ee';
    const metalEdge = flash ? '#fff' : '#7d8994';
    const wood = flash ? '#fff' : '#6b4a2e';
    const gold = flash ? '#fff' : '#c9a24a';
    ctx.save();
    ctx.translate(hx, hy);
    ctx.rotate(ang);
    ctx.lineCap = 'round';
    switch (kind) {
      case 'kilic': {
        ctx.fillStyle = wood;
        ctx.fillRect(-10, -2.5, 13, 5);
        ctx.fillStyle = gold;
        ctx.fillRect(3, -7, 3.5, 14);
        ctx.beginPath();
        ctx.arc(-11, 0, 3.5, 0, 7);
        ctx.fill();
        ctx.fillStyle = metal;
        ctx.beginPath();
        ctx.moveTo(6, -2.5);
        ctx.quadraticCurveTo(40, -3, 68, -11);
        ctx.quadraticCurveTo(44, 4, 6, 2.5);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = metalEdge;
        ctx.lineWidth = 1;
        ctx.stroke();
        break;
      }
      case 'yatagan': {
        ctx.fillStyle = flash ? '#fff' : '#e8e0cf';
        ctx.beginPath();
        ctx.moveTo(-4, -3);
        ctx.lineTo(-12, -7);
        ctx.lineTo(-13, 5);
        ctx.lineTo(-4, 3);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = gold;
        ctx.fillRect(-4, -3.5, 6, 7);
        ctx.fillStyle = metal;
        ctx.beginPath();
        ctx.moveTo(2, -2.5);
        ctx.quadraticCurveTo(30, -9, 52, 1);
        ctx.quadraticCurveTo(30, 0, 2, 3);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = metalEdge;
        ctx.lineWidth = 1;
        ctx.stroke();
        break;
      }
      case 'mizrak':
      case 'bayrak': {
        ctx.strokeStyle = wood;
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(-62, 0);
        ctx.lineTo(98, 0);
        ctx.stroke();
        ctx.fillStyle = metal;
        ctx.beginPath();
        ctx.moveTo(96, -5);
        ctx.quadraticCurveTo(110, -5, 124, 0);
        ctx.quadraticCurveTo(110, 5, 96, 5);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = metalEdge;
        ctx.lineWidth = 1;
        ctx.stroke();
        ctx.fillStyle = flash ? '#fff' : '#a8262b';
        ctx.beginPath();
        ctx.moveTo(93, 0);
        ctx.lineTo(87, 12);
        ctx.lineTo(95, 10);
        ctx.closePath();
        ctx.fill();
        if (kind === 'bayrak') {
          const wave = Math.sin(performance.now() / 160) * 5;
          ctx.fillStyle = flash ? '#fff' : '#b0232a';
          ctx.beginPath();
          ctx.moveTo(84, 2);
          ctx.quadraticCurveTo(70, 30 + wave, 48, 52);
          ctx.lineTo(24, 40 + wave);
          ctx.lineTo(40, 26);
          ctx.quadraticCurveTo(56, 12, 60, 2);
          ctx.closePath();
          ctx.fill();
          ctx.strokeStyle = gold;
          ctx.lineWidth = 2;
          ctx.stroke();
        }
        break;
      }
      case 'tufek': {
        ctx.fillStyle = wood;
        ctx.beginPath();
        ctx.moveTo(-44, -2);
        ctx.lineTo(-10, -3);
        ctx.lineTo(-10, 4);
        ctx.lineTo(-44, 8);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = flash ? '#fff' : '#3a3a3e';
        ctx.fillRect(-12, -3, 98, 4);
        ctx.fillStyle = gold;
        ctx.fillRect(-14, -4, 6, 7);
        ctx.fillRect(40, -4, 3, 6);
        break;
      }
      case 'tabanca': {
        ctx.fillStyle = wood;
        ctx.beginPath();
        ctx.moveTo(-4, -3);
        ctx.lineTo(4, -3);
        ctx.lineTo(-2, 12);
        ctx.lineTo(-9, 11);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = flash ? '#fff' : '#3a3a3e';
        ctx.fillRect(0, -5, 28, 4);
        ctx.fillStyle = gold;
        ctx.fillRect(-2, -6, 6, 6);
        ctx.beginPath();
        ctx.arc(-8, 11, 3, 0, 7);
        ctx.fill();
        break;
      }
      case 'yay': {
        // Türk yayı: el noktası kabzadır, yay namluya dik durur
        const pull = 8 + 42 * ((pose && pose.draw) || 0);
        ctx.strokeStyle = flash ? '#fff' : '#4a2f1d';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(-6, -40);
        ctx.quadraticCurveTo(2, -36, 4, -22);
        ctx.quadraticCurveTo(10, -6, 0, 0);
        ctx.quadraticCurveTo(10, 6, 4, 22);
        ctx.quadraticCurveTo(2, 36, -6, 40);
        ctx.stroke();
        ctx.strokeStyle = flash ? '#fff' : '#e8e2d2';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(-6, -40);
        ctx.lineTo(-pull, 0);
        ctx.lineTo(-6, 40);
        ctx.stroke();
        if (pose && pose.draw > 0.05) {
          ctx.strokeStyle = wood;
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(-pull, 0);
          ctx.lineTo(16, 0);
          ctx.stroke();
          ctx.fillStyle = metal;
          ctx.beginPath();
          ctx.moveTo(16, -3);
          ctx.lineTo(23, 0);
          ctx.lineTo(16, 3);
          ctx.fill();
        }
        break;
      }
      case 'cirit': {
        ctx.strokeStyle = flash ? '#fff' : '#8a6a44';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(-34, 0);
        ctx.lineTo(62, 0);
        ctx.stroke();
        ctx.fillStyle = metal;
        ctx.beginPath();
        ctx.moveTo(60, -3.5);
        ctx.lineTo(76, 0);
        ctx.lineTo(60, 3.5);
        ctx.fill();
        break;
      }
      case 'topuz': {
        ctx.strokeStyle = wood;
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.moveTo(-8, 0);
        ctx.lineTo(48, 0);
        ctx.stroke();
        ctx.fillStyle = flash ? '#fff' : '#6c737a';
        ctx.beginPath();
        ctx.arc(56, 0, 13, 0, 7);
        ctx.fill();
        ctx.fillStyle = flash ? '#fff' : '#9aa2aa';
        for (let i = 0; i < 6; i++) {
          const a = (i / 6) * Math.PI * 2;
          ctx.beginPath();
          ctx.arc(56 + Math.cos(a) * 12, Math.sin(a) * 12, 4, 0, 7);
          ctx.fill();
        }
        break;
      }
    }
    ctx.restore();
  };

  // ---------- At ----------
  K.drawHorse = function (ctx, x, y, facing, t, running) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(facing, 1);
    const leg = running ? Math.sin(t * 16) : 0;
    ctx.strokeStyle = '#3d2618';
    ctx.lineWidth = 8;
    ctx.lineCap = 'round';
    const legs = [[-40, leg], [-28, -leg], [32, -leg], [44, leg]];
    for (const [lx, l] of legs) {
      ctx.beginPath();
      ctx.moveTo(lx, -62);
      ctx.lineTo(lx + l * 14, -30);
      ctx.lineTo(lx + l * 8, -2);
      ctx.stroke();
    }
    ctx.fillStyle = '#5a3a24';
    ctx.beginPath();
    ctx.ellipse(0, -76, 58, 24, 0, 0, 7);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(40, -88);
    ctx.lineTo(70, -132);
    ctx.lineTo(92, -122);
    ctx.lineTo(62, -76);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(86, -124, 18, 10, 0.5, 0, 7);
    ctx.fill();
    ctx.fillStyle = '#1c120b';
    ctx.beginPath();
    ctx.moveTo(44, -92);
    ctx.lineTo(66, -134);
    ctx.lineTo(58, -100);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#1c120b';
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.moveTo(-56, -80);
    ctx.quadraticCurveTo(-76, -60, -70, -36 + leg * 4);
    ctx.stroke();
    // Eyer ve örtü
    ctx.fillStyle = '#a8262b';
    ctx.fillRect(-22, -102, 40, 14);
    ctx.fillStyle = '#c9a24a';
    ctx.fillRect(-22, -90, 40, 4);
    ctx.restore();
  };

})(window.K);

  <script>
/* ---- js/pixelbg.js ---- */
'use strict';
// Piksel sanatı arka plan. Her şey düşük çözünürlükte (sanat pikseli) üretilir, PX katıyla büyütülür.
(function (K) {
  const PX = 3;
  const AW = Math.ceil(K.W / PX); // 427
  const AH = Math.ceil(K.H / PX); // 240
  const GY = Math.round(K.GROUND / PX); // 203: sokak zemininin üst çizgisi
  K.PX = PX;
  const FAR_DY = -80, ROOF_DY = -58;

  // ---------- Yardımcılar ----------
  const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map(v => (v + 0.5) / 16);
  const bayer = (x, y) => BAYER[(y & 3) * 4 + (x & 3)];
  const hash = (x, y) => {
    const s = Math.sin(x * 12.9898 + y * 78.233) * 43758.5453;
    return s - Math.floor(s);
  };
  const rgb = h => {
    const n = parseInt(h.slice(1), 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  };
  const hex = ([r, g, b]) => '#' + ((1 << 24) | (r << 16) | (g << 8) | b).toString(16).slice(1);
  const mix = (a, b, t) => {
    const A = rgb(a), B = rgb(b);
    return hex(A.map((v, i) => Math.round(v + (B[i] - v) * t)));
  };
  const lt = (c, t) => mix(c, '#fff4dc', t);
  const dk = (c, t) => mix(c, '#100810', t);

  function mk(w, h) {
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.ceil(w));
    c.height = Math.max(1, Math.ceil(h));
    const g = c.getContext('2d');
    return { c, g, w: c.width, h: c.height };
  }
  function R(g, x, y, w, h, col) {
    x = Math.round(x);
    y = Math.round(y);
    w = Math.round(w);
    h = Math.round(h);
    if (w <= 0 || h <= 0) return;
    g.fillStyle = col;
    g.fillRect(x, y, w, h);
  }
  function P(g, x, y, col) {
    g.fillStyle = col;
    g.fillRect(Math.round(x), Math.round(y), 1, 1);
  }
  // Satır satır, aynı renk dizilerini tek dikdörtgende çizer. fn(x,y) renk ya da null döndürür.
  function paint(g, x0, y0, w, h, fn) {
    for (let y = y0; y < y0 + h; y++) {
      let run = null, rs = x0;
      for (let x = x0; x <= x0 + w; x++) {
        const c = x < x0 + w ? fn(x, y) : null;
        if (c !== run) {
          if (run) R(g, rs, y, x - rs, 1, run);
          run = c;
          rs = x;
        }
      }
    }
  }
  // Işığı sağ üstten alan, kenarları gürültülü bir küme (ağaç tacı, bitki, saman)
  function blob(g, cx, cy, rx, ry, cols, seed = 0) {
    paint(g, Math.floor(cx - rx - 2), Math.floor(cy - ry - 2), Math.ceil(rx * 2 + 4), Math.ceil(ry * 2 + 4), (x, y) => {
      const dx = (x - cx) / rx, dy = (y - cy) / ry;
      const n = hash(x + seed, y) * 0.35;
      if (dx * dx + dy * dy > 1 + n - 0.15) return null;
      const l = dx * 0.6 - dy * 0.8 + (hash(y, x + seed) - 0.5) * 0.5;
      if (l > 0.45 + bayer(x, y) * 0.3) return cols[2];
      if (l < -0.35 - bayer(x, y) * 0.3) return cols[0];
      return cols[1];
    });
  }
  // Yarım küre kubbe; sağ tarafı aydınlık
  function dome(g, cx, by, r, col, lit, dark, rim) {
    for (let dy = 0; dy <= r; dy++) {
      const hw = Math.round(Math.sqrt(r * r - dy * dy));
      const y = by - dy;
      for (let x = cx - hw; x <= cx + hw; x++) {
        const k = (x - cx) / (hw + 0.01);
        let c = col;
        if (k > 0.35 + bayer(x, y) * 0.3) c = lit;
        else if (k < -0.45 - bayer(x, y) * 0.3) c = dark;
        P(g, x, y, c);
      }
      if (rim) P(g, cx + hw, y, rim);
    }
    if (rim) R(g, cx - 1, by - r, 3, 1, rim);
  }
  // Görüntü verisinde renkleri bir sis rengine doğru karıştırır
  const emissive = (r, g, b) => r >= 195 && r - b > 90;
  function haze(L, col, amt, fromY = 0, keepLit = false) {
    const id = L.g.getImageData(0, 0, L.w, L.h);
    const d = id.data;
    const H = rgb(col);
    for (let y = fromY; y < L.h; y++) {
      for (let x = 0; x < L.w; x++) {
        const i = (y * L.w + x) * 4;
        if (!d[i + 3]) continue;
        if (keepLit && emissive(d[i], d[i + 1], d[i + 2])) continue;
        const a = typeof amt === 'function' ? amt(y) : amt;
        d[i] += (H[0] - d[i]) * a;
        d[i + 1] += (H[1] - d[i + 1]) * a;
        d[i + 2] += (H[2] - d[i + 2]) * a;
      }
    }
    L.g.putImageData(id, 0, 0);
  }

  // Dünya x'ine göre semt
  function district(worldX) {
    if (worldX < 4700) return 'mahalle';
    if (worldX < 9500) return 'carsi';
    if (worldX < 14300) return 'cami';
    if (worldX < K.GATE_X - 1150) return 'bostan';
    return 'sur';
  }
  K.district = district;

  // ---------- Renkler ----------
  const SKY = ['#06060e', '#0c0b19', '#141125', '#1f1530', '#2c1936', '#3c1c39', '#521f3a', '#6c2338', '#882a35', '#a53632', '#c04d33', '#d8703c', '#e99a55', '#f6c886'];
  const WOOD = ['#9a6a40', '#7e3a2c', '#b89a70', '#5e3e2c', '#6a6e80', '#a8624c', '#8a5a3a'];
  const STONE = { base: '#6e6068', light: '#867880', dark: '#564a54', mortar: '#463a44' };
  const ROOF = ['#8e362a', '#a8453a', '#7a2e26'];

  // ---------- Gökyüzü ----------
  function genSky(top, bottom, sunY, glow, stars, seed, moon) {
    const L = mk(AW, AH);
    const id = L.g.createImageData(AW, AH);
    const d = id.data;
    const PAL = SKY.map(rgb);
    const sx = 330, horizon = 112;
    for (let y = 0; y < AH; y++) {
      for (let x = 0; x < AW; x++) {
        const t = Math.min(1, y / horizon);
        let f = top + (bottom - top) * Math.pow(t, 1.35);
        const dist = Math.hypot((x - sx) * 0.8, y - sunY);
        f += Math.max(0, glow * (1 - dist / 120)) + Math.max(0, glow * 0.6 * (1 - dist / 40));
        let c;
        if (dist < 11 && sunY < horizon + 6) c = dist < 7 ? [255, 226, 190] : [246, 168, 118];
        else {
          f = K.clamp(f, 0, PAL.length - 1);
          const i = Math.floor(f);
          c = PAL[Math.min(PAL.length - 1, i + ((f - i) > bayer(x, y) ? 1 : 0))];
        }
        const k = (y * AW + x) * 4;
        d[k] = c[0];
        d[k + 1] = c[1];
        d[k + 2] = c[2];
        d[k + 3] = 255;
      }
    }
    L.g.putImageData(id, 0, 0);
    const r = K.seeded(seed);
    if (moon) {
      drawMoon(L.g, moon.x, moon.y, moon.r, moon.a);
      cloudBank(L.g, moon.x + 30, moon.y + 14, 96, 15, moon, r);
      cloudBank(L.g, moon.x - 6, moon.y - 24, 46, 7, moon, r);
    }
    for (let i = 0; i < stars; i++) {
      const x = Math.floor(r() * AW), y = Math.floor(r() * 90);
      P(L.g, x, y, r() < 0.3 ? '#e8e2ff' : '#9c94c4');
    }
    return L;
  }

  // Ayın önünden geçen koyu bulut kümesi; aya yakın üst kenarları gümüş ışık alır
  function cloudBank(g, cx, cy, w, h, moon, r) {
    const parts = [];
    const n = 5 + Math.floor(r() * 4);
    for (let i = 0; i < n; i++) parts.push({ x: cx + (r() - 0.5) * w, y: cy + (r() - 0.5) * h * 0.6, rx: w * (0.15 + r() * 0.2), ry: h * (0.4 + r() * 0.4) });
    const inside = (x, y) => parts.some(q => ((x - q.x) / q.rx) ** 2 + ((y - q.y) / q.ry) ** 2 <= 1);
    paint(g, Math.floor(cx - w), Math.floor(cy - h * 1.5), Math.ceil(w * 2), Math.ceil(h * 3), (x, y) => {
      if (!inside(x, y)) return null;
      const dm = Math.hypot(x - moon.x, y - moon.y);
      const near = dm < moon.r * 3.6;
      if (!inside(x, y - 1)) return near ? '#c8c2dc' : '#4a2e44';
      if (!inside(x, y - 2)) return near ? '#7a7494' : '#2e1e30';
      if (!inside(x, y + 1) && !near) return '#5a1e2a';
      const v = (y - cy) / h;
      return v < -0.1 && bayer(x, y) > 0.5 ? '#1a1424' : '#0f0b17';
    });
  }

  // Batan iri ay: solgun, kraterli, hafif hale
  function drawMoon(g, cx, cy, rad, alpha) {
    paint(g, cx - rad * 3, cy - rad * 3, rad * 6, rad * 6, (x, y) => {
      const d = Math.hypot(x - cx, y - cy);
      if (d <= rad) {
        const l = ((x - cx) * -0.6 + (cy - y) * 0.5) / rad;
        const crater = hash(Math.floor(x / 3), Math.floor(y / 3)) < 0.18 && d < rad - 2;
        if (crater) return '#a8a0b8';
        if (l > 0.35 + bayer(x, y) * 0.3) return '#f0ecf4';
        if (l < -0.45 - bayer(x, y) * 0.3) return '#9c94ac';
        return '#d6d0e0';
      }
      const h = (1 - (d - rad) / (rad * 2)) * alpha;
      return h > bayer(x, y) + 0.25 ? '#3a3050' : null;
    });
  }

  function genCloud(r) {
    const w = 50 + Math.floor(r() * 90), lines = 3 + Math.floor(r() * 3);
    const L = mk(w + 20, lines * 3 + 4);
    let x0 = 10, len = w * 0.4;
    for (let i = 0; i < lines; i++) {
      const y = 2 + i * 3;
      const last = i === lines - 1;
      const lx = Math.round(x0 + (r() - 0.5) * 16), ll = Math.round(len);
      R(L.g, lx, y, ll, last ? 1 : 2, last ? '#a8343a' : i === 0 ? '#3a2242' : '#2a1832');
      if (!last) R(L.g, lx + 2, y + 2, ll - 4, 1, '#6a2838');
      x0 = lx - 6 + r() * 10;
      len = Math.min(w, len + 10 + r() * 30);
    }
    return L;
  }

  // ---------- Uzak silüet: camiler, Galata Kulesi, servi ----------
  function silMosque(g, cx, by, s, base, rim) {
    const bw = Math.round(64 * s), bh = Math.round(20 * s);
    R(g, cx - bw / 2, by - bh, bw, bh + 20, base);
    const dr = Math.round(18 * s);
    R(g, cx - dr - 2, by - bh - 4, dr * 2 + 5, 5, base);
    dome(g, cx, by - bh - 4, dr, base, base, base, rim);
    R(g, cx, by - bh - 4 - dr - 5, 1, 5, rim);
    for (const sgn of [-1, 1]) {
      dome(g, cx + sgn * Math.round(17 * s), by - bh, Math.round(10 * s), base, base, base, rim);
      dome(g, cx + sgn * Math.round(28 * s), by - bh, Math.round(5 * s), base, base, base, rim);
    }
    const mins = s > 1 ? [-1, -0.8, 0.8, 1] : [-1, 1];
    for (const m of mins) {
      const mx = Math.round(cx + m * (bw / 2 + 6 * s));
      const mh = Math.round((Math.abs(m) === 1 ? 74 : 60) * s);
      R(g, mx - 1, by - mh, 3, mh + 20, base);
      R(g, mx - 2, by - Math.round(mh * 0.72), 5, 1, base);
      if (s > 0.9) R(g, mx - 2, by - Math.round(mh * 0.86), 5, 1, base);
      for (let i = 0; i < 9; i++) R(g, mx - (i < 3 ? 1 : 0), by - mh - i, i < 3 ? 3 : 1, 1, base);
      R(g, mx + 1, by - mh, 1, Math.round(mh * 0.3), rim);
    }
  }
  function galata(g, x, by, base, rim) {
    R(g, x - 6, by - 64, 13, 70, base);
    R(g, x - 7, by - 50, 15, 2, base);
    for (let i = 0; i < 16; i++) R(g, x - 7 + Math.floor(i / 2.2), by - 64 - i, 15 - Math.floor(i / 1.1), 1, base);
    R(g, x + 6, by - 64, 1, 64, rim);
    R(g, x, by - 82, 1, 3, rim);
  }
  function cypress(g, x, by, h, w, cols) {
    for (let i = 0; i < h; i++) {
      const t = i / h;
      const hw = Math.max(0.5, w * Math.sin(Math.PI * Math.min(1, (1 - t) * 1.15)) * (t < 0.15 ? t / 0.15 * 0.6 + 0.4 : 1));
      const half = Math.round(hw);
      for (let x = x - half; x <= x + half; x++) {
        const k = (x - (x - half)) / (half * 2 + 0.01);
        P(g, x, by - i, k > 0.7 + bayer(x, by - i) * 0.25 ? cols[2] : k < 0.25 ? cols[0] : cols[1]);
      }
    }
  }
  function cypressAt(g, x, by, h, w, cols) {
    for (let i = 0; i < h; i++) {
      const t = i / h;
      const hw = w * Math.sin(Math.PI * Math.min(1, (1 - t) * 1.1 + 0.02)) * (t < 0.12 ? 0.55 + t * 3.7 : 1);
      const half = Math.max(0, Math.round(hw));
      for (let xx = x - half; xx <= x + half; xx++) {
        const k = half ? (xx - x) / half : 0;
        const y = by - i;
        P(g, xx, y, k > 0.35 + bayer(xx, y) * 0.4 ? cols[2] : k < -0.45 ? cols[0] : cols[1]);
      }
    }
  }

  function genFar(w) {
    const L = mk(w, AH), g = L.g, r = K.seeded(7);
    const base = '#170f1f', rim = '#7a2434';
    let y = 186;
    for (let x = 0; x < w; x++) {
      y = K.clamp(y + (r() - 0.5) * 1.3, 181, 192);
      R(g, x, Math.round(y), 1, AH, base);
      if (r() < 0.04) P(g, x, Math.round(y) - 1, base);
    }
    let x = 20, gal = false;
    while (x < w - 30) {
      if (!gal && x > w * 0.25) {
        galata(g, x, 188, base, rim);
        gal = true;
        x += 40;
        continue;
      }
      const k = r();
      if (k < 0.5) {
        const s = 0.65 + r() * 0.65;
        silMosque(g, x + 40 * s, 189, s, base, rim);
        x += 90 * s + 20 + r() * 110;
      } else {
        const n = 1 + Math.floor(r() * 4);
        for (let i = 0; i < n; i++) cypressAt(g, x + i * 5, 190, 14 + Math.floor(r() * 12), 2, [base, base, rim]);
        x += n * 5 + 15 + r() * 40;
      }
    }
    haze(L, '#3a1a34', y => K.clamp((y - 150) / 60, 0, 0.5), 150);
    return L;
  }

  // ---------- Şehir çatıları ----------
  function genRoofs(w, smoke) {
    const L = mk(w, AH), g = L.g, r = K.seeded(11);
    const rows = [{ by: 191, hz: 0.5 }, { by: 199, hz: 0.25 }];
    for (const row of rows) {
      let x = -10;
      while (x < w) {
        const k = r();
        if (k < 0.07) {
          // hamam / küçük cami kubbesi
          const rr = 6 + Math.floor(r() * 6);
          R(g, x, row.by - rr - 4, rr * 2 + 4, rr + 30, '#2a2034');
          dome(g, x + rr + 2, row.by - rr - 4, rr, '#34324a', '#4c4864', '#221e30', '#8a3a44');
          for (let i = 0; i < 3; i++) P(g, x + rr - 2 + i * 2, row.by - rr - 4 - Math.floor(rr * 0.6), '#f0c070');
          x += rr * 2 + 6;
        } else if (k < 0.12) {
          cypressAt(g, x + 3, row.by + 2, 22 + Math.floor(r() * 16), 3, ['#0c0e14', '#14181a', '#3a2028']);
          x += 8;
        } else if (k < 0.14) {
          // yakın minare
          const mh = 70 + Math.floor(r() * 30);
          R(g, x, row.by - mh, 4, mh + 10, '#2e2638');
          R(g, x + 3, row.by - mh, 1, Math.round(mh * 0.3), '#8a3040');
          R(g, x - 1, row.by - Math.round(mh * 0.7), 6, 2, '#241e2e');
          for (let i = 0; i < 12; i++) R(g, x + (i < 3 ? 0 : Math.floor(i / 6)), row.by - mh - i, Math.max(1, 4 - Math.floor(i / 3)), 1, '#262838');
          x += 10;
        } else {
          const bw = 9 + Math.floor(r() * 16), wh = 7 + Math.floor(r() * 12), rh = 3 + Math.floor(r() * 3);
          const wall = ['#2e2236', '#34263a', '#2a2032', '#3a2a3a'][Math.floor(r() * 4)];

  // ---------- Bina parçaları ----------
  function stoneWall(g, x, y, w, h, pal = STONE, course = 5, seed = 0) {
    R(g, x, y, w, h, pal.mortar);
    let row = 0;
    for (let yy = y; yy < y + h; yy += course, row++) {
      const ch = Math.min(course, y + h - yy);
      let xx = x - Math.floor(hash(row + seed, x) * 9);
      while (xx < x + w) {
        const sw = 6 + Math.floor(hash(xx, yy + seed) * 7);
        const a = Math.max(x, xx), b = Math.min(x + w, xx + sw - 1);
        const v = hash(xx + 3, yy + seed * 7);
        const c = v < 0.25 ? pal.dark : v > 0.8 ? pal.light : pal.base;
        R(g, a, yy, b - a, ch - 1, c);
        if (b - a > 1) R(g, a, yy, b - a, 1, lt(c, 0.12));
        xx += sw;
      }
    }
  }
  function window_(g, x, y, w, h, kind, frame = '#c8b490') {
    R(g, x - 1, y - 1, w + 2, h + 2, frame);
    if (kind === 'lit') {
      R(g, x, y, w, h, '#ffcf6e');
      R(g, x, y + h - 2, w, 2, '#ee9a4c');
      R(g, x + Math.floor(w / 2), y, 1, h, '#c8783e');
    } else {
      R(g, x, y, w, h, '#24161c');
      R(g, x + w - 1, y, 1, h, '#3a2630');
    }
    if (kind === 'kafes') {
      for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) if ((i + j) % 2 === 0) P(g, x + i, y + j, '#5a3a28');
    }
    R(g, x - 1, y + h + 1, w + 2, 1, dk(frame, 0.3));
  }

    const v = r();

  }
  function roof(g, x, w, eaveY, h, pal) {
    for (let i = 0; i < h; i++) {
      const y = eaveY - i;
      const inset = Math.round(i * 1.6);
      for (let xx = x - 4 + inset; xx < x + w + 4 - inset; xx++) {

        P(g, xx, y, c);

    R(g, x - 4, eaveY + 1, w + 8, 1, '#3a1c1a');
    R(g, x - 3, eaveY + 2, w + 6, 1, 'rgba(20,8,12,0.55)');
  }
  // Ahşap Osmanlı evi. opts: base (alt çizgi), top (çatı saçağı), gf (zemin kat üstü)
  function house(g, x, w, opts, r) {
    const base = opts.base, top = opts.top, gf = opts.gf;
    const col = opts.col || WOOD[Math.floor(r() * WOOD.length)];
    const pal = ROOF.slice(Math.floor(r() * 2));
    // zemin kat: taş
    stoneWall(g, x + 2, gf, w - 4, base - gf, STONE, 5, Math.floor(r() * 99));
    // kapı
    const dx = x + 4 + Math.floor(r() * (w - 20));
    R(g, dx - 1, base - 23, 13, 23, STONE.light);
    R(g, dx, base - 21, 11, 21, '#4a2c20');
    for (let i = 2; i < 11; i += 3) R(g, dx + i, base - 20, 1, 20, '#3a2018');
    R(g, dx, base - 22, 11, 1, '#4a2c20');
    P(g, dx + 8, base - 11, '#d8b060');
    if (w > 40) {
      const wx = dx > x + w / 2 ? x + 6 : x + w - 14;
      window_(g, wx, gf + 6, 7, 9, 'dark', STONE.light);
      for (let i = 1; i < 7; i += 2) R(g, wx + i, gf + 6, 1, 9, '#2a2026');
    }
    // üst katlar: çıkma
    const ux = x - 1, uw = w + 2;
    R(g, ux, top, uw, gf - top, col);
    for (let y = top + 2; y < gf; y += 3) R(g, ux, y, uw, 1, dk(col, 0.12));
    R(g, ux + uw - 1, top, 1, gf - top, lt(col, 0.25));
    R(g, ux, top, 1, gf - top, dk(col, 0.3));
    R(g, ux - 1, gf - 2, uw + 2, 2, '#3a2420');
    for (let bx = ux + 3; bx < ux + uw - 2; bx += 9) {
      P(g, bx, gf, '#3a2420');
      P(g, bx + 1, gf + 1, '#3a2420');
      P(g, bx + 2, gf + 2, '#3a2420');
    }
    const floors = Math.max(1, Math.round((gf - top) / 22));
    const fh = (gf - top) / floors;
    for (let f = 0; f < floors; f++) {
      const fy = Math.round(top + f * fh);
      if (f > 0) R(g, ux, fy, uw, 1, dk(col, 0.4));
      const n = Math.max(1, Math.floor((uw - 6) / 11));
      const sp = (uw - 6) / n;
      for (let i = 0; i < n; i++) window_(g, Math.round(ux + 4 + i * sp + (sp - 7) / 2), fy + 5, 6, Math.min(10, fh - 9), pickWin(r));
    }
    // cumba

      const cw = 22, cx = Math.round(x + w / 2 - cw / 2), cy = top + 3;

      R(g, cx + cw + 1, cy, 1, gf - cy - 3, lt(col, 0.3));
      R(g, cx - 3, cy - 2, cw + 6, 2, '#3a2420');
      for (let i = 0; i < 3; i++) window_(g, cx + 1 + i * 7, cy + 4, 5, Math.min(12, gf - cy - 12), pickWin(r));
      P(g, cx, gf - 2, '#3a2420');
      P(g, cx + 1, gf - 1, '#3a2420');
      P(g, cx + cw, gf - 2, '#3a2420');
    }
    roof(g, ux, uw, top - 1, opts.roofH || 9, pal);
    if (r() < 0.6) {
      const cx = ux + 6 + Math.floor(r() * (uw - 12));
      R(g, cx, top - 12, 3, 8, '#6a5a60');
      R(g, cx - 1, top - 13, 5, 1, '#4a3e44');
      if (opts.smoke) opts.smoke.push({ x: cx + 1, y: top - 14, s: r() * 10 });
    }
  }

    for (let i = 10; i < w - 10; i += 30) {
      const wx = x + i, wy = 140;
      R(g, wx - 2, wy - 2, 16, 26, '#a89ea2');
      for (let k = 0; k < 7; k++) R(g, wx - 2 + k, wy - 3 - k, 16 - k * 2, 1, '#a89ea2');
      R(g, wx, wy, 12, 22, '#2a2028');
      for (let k = 0; k < 5; k++) R(g, wx + k + 1, wy - 1 - k, 10 - k * 2, 1, '#2a2028');
      for (let yy = wy; yy < wy + 22; yy += 2) for (let xx = wx; xx < wx + 12; xx += 2) P(g, xx + ((yy / 2) % 2), yy, '#5a5058');
    }
  };
  near.portal = function (g, x, r, S) {
    const w = 56, top = 70;
    const pal = { base: '#9a8e92', light: '#b0a4a8', dark: '#867a80', mortar: '#6e6268' };
    stoneWall(g, x, top, w, GY - top, pal, 6, x);

    R(g, x + 6, top + 6, w - 12, GY - top - 6, '#6e6268');
    R(g, x + 8, top + 8, w - 16, GY - top - 8, '#8a7e84');
    // mukarnas
    for (let row = 0; row < 8; row++) {
      for (let i = 0; i < (w - 18) / 4 - row * 0.5; i++) {
        const px = x + 9 + row * 2 + i * 4, py = top + 10 + row * 4;
        if (px > x + w - 12 - row * 2) continue;
        R(g, px, py, 3, 3, row % 2 ? '#a09498' : '#766a72');
        P(g, px + 1, py + 2, '#4e4248');
      }
    }
    R(g, x + 14, top + 48, w - 28, 6, '#2e3a5a');
    for (let i = 0; i < w - 30; i += 3) P(g, x + 15 + i, top + 50, '#d8b060');
    R(g, x + 16, GY - 40, w - 32, 40, '#4a2c20');
    R(g, x + w / 2, GY - 40, 1, 40, '#2a1810');
    for (let yy = GY - 36; yy < GY - 2; yy += 6) for (let xx = x + 18; xx < x + w - 18; xx += 6) P(g, xx, yy, '#c9a24a');
  };
  near.bostan = function (g, x, r, S) {
    const k = r();
    if (k < 0.3) {
      // çit
      const w = 40 + Math.floor(r() * 30);
      for (let i = 0; i < w; i += 7) R(g, x + i, GY - 22, 2, 22, '#6a4a32');
      R(g, x, GY - 18, w, 2, '#7a5a3a');
      R(g, x, GY - 10, w, 2, '#7a5a3a');
      if (r() < 0.7) tree(g, x + w / 2, GY - 4, 56 + r() * 20, r, ['#1e2e1c', '#3a5a2c', '#6a8a44']);

    }
    if (k < 0.5) {
      // meyve ağacı
      tree(g, x + 16, GY, 60 + r() * 20, r, ['#20301c', '#3a5a2c', '#6a8a44']);
      for (let i = 0; i < 8; i++) P(g, x + 4 + r() * 24, GY - 40 - r() * 20, '#e0702a');

    if (k < 0.65) {
      // saman yığını
      blob(g, x + 14, GY - 9, 14, 10, ['#9a7a34', '#c8a050', '#e8c870'], x);
      for (let i = 0; i < 6; i++) R(g, x + 4 + i * 4, GY - 14 + (i % 2) * 3, 1, 5, '#8a6a2a');
      return 32;
    }
    if (k < 0.8) {
      // kuyu
      stoneWall(g, x, GY - 14, 22, 14, STONE, 4, x);
      R(g, x + 2, GY - 34, 2, 20, '#5a3a28');
      R(g, x + 18, GY - 34, 2, 20, '#5a3a28');
      for (let i = 0; i < 6; i++) R(g, x - 2 + i, GY - 36 - i, 26 - i * 2, 1, i % 2 ? '#8e362a' : '#a8453a');
      R(g, x + 10, GY - 30, 1, 8, '#3a2a22');
      R(g, x + 8, GY - 22, 5, 4, '#6a4a32');
      return 30;
    }
    // alçak taş duvar
    const w = 30 + Math.floor(r() * 30);
    stoneWall(g, x, GY - 16, w, 16, STONE, 4, x);
    R(g, x - 1, GY - 17, w + 2, 1, '#8c7e84');
    return w + 4;
  };

  function line(g, x0, y0, x1, y1, col) {
    const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0), 1);
    for (let i = 0; i <= n; i++) P(g, Math.round(x0 + ((x1 - x0) * i) / n), Math.round(y0 + ((y1 - y0) * i) / n), col);
  }
  // Mangal: ayaklı demir sepet, üstünde canlı ateş
  near.brazier = function (g, x, S) {
    const iron = '#1c1418', ironL = '#4a3a34';
    line(g, x - 7, GY, x - 4, GY - 20, iron);
    line(g, x + 7, GY, x + 4, GY - 20, iron);
    line(g, x, GY, x, GY - 20, iron);
    R(g, x - 8, GY - 27, 17, 2, ironL);
    R(g, x - 7, GY - 25, 15, 5, iron);
    for (let i = -6; i <= 6; i += 2) P(g, x + i, GY - 24, ironL);
    for (let i = -6; i <= 6; i++) P(g, x + i, GY - 28, i % 2 ? '#ff8a2a' : '#d84a1a');
    S.fires.push({ x, y: GY - 28, w: 13, h: 18, s: hash(x, 1) * 10 });
  };
  near.wallTorch = function (g, x, y, S) {
    R(g, x - 2, y + 2, 5, 2, '#1c1418');
    R(g, x, y - 6, 2, 9, '#4a3020');
    R(g, x - 1, y - 8, 4, 2, '#1c1418');

  near.campfire = function (g, x, S) {
    for (let i = -7; i <= 7; i += 3) R(g, x + i, GY - 3, 3, 3, '#4a4048');
    line(g, x - 6, GY - 2, x + 5, GY - 5, '#3a2618');
    line(g, x + 6, GY - 2, x - 5, GY - 5, '#3a2618');

  };
  function crescent(g, cx, cy, rad, col) {
    for (let y = -rad; y <= rad; y++) {
      for (let x = -rad; x <= rad; x++) {
        if (x * x + y * y > rad * rad) continue;
        const ox = x - rad * 0.45, oy = y + rad * 0.15;
        if (ox * ox + oy * oy <= (rad * 0.82) ** 2) continue;
        P(g, cx + x, cy + y, col);
      }
    }
  }
  // Hilalli, ucu yırtık kızıl sancak (x sol kenar, y asılı olduğu çubuk)
  near.banner = function (g, x, y, h) {
    const w = 15;
    R(g, x - 3, y, w + 6, 2, '#2a1c14');
    P(g, x - 4, y, '#c9a24a');
    P(g, x + w + 3, y, '#c9a24a');
    for (let i = 0; i < w; i++) {
      const len = h - Math.floor(hash(x + i, y) * 7) - (i % 5 === 2 ? 4 : 0);
      for (let j = 0; j < len; j++) {
        let c = i % 5 === 0 ? '#4e0e14' : i % 5 === 4 ? '#8a1c22' : '#6e161c';
        if (j < 2) c = '#c9a24a';
        if (hash(i * 7 + x, j) < 0.04) c = '#3a0a10';
        P(g, x + i, y + 2 + j, c);
      }
    }
    crescent(g, x + 7, y + 4 + Math.round(h * 0.35), 5, '#d8b060');
  };

  // İstanbul surları: taş ve tuğla hatıllı; kapının ortası gx
  function cityWalls(g, x0, x1, gx, S) {
    const top = 72;
    const stone = { base: '#7a6c70', light: '#8e8084', dark: '#665a60', mortar: '#4e4248' };
    const bandRow = y => ((y - top) % 22 + 22) % 22 >= 15;
    const masonry = (x, y, w, h, seed) => {
      stoneWall(g, x, y, w, h, stone, 4, seed);
      for (let yy = y; yy < y + h; yy++) {
        if (!bandRow(yy)) continue;
        const brick = (yy % 2 ? (Math.floor((yy - x) / 1) % 1) : 0);
        R(g, x, yy, w, 1, yy % 2 ? '#7e4034' : '#8e4a3a');
        for (let xx = x + (yy % 2) * 3; xx < x + w; xx += 6) P(g, xx, yy, '#5a3a32');
        void brick;
      }
    };
    const crenel = (x, w, y) => {
      for (let i = 0; i < w; i += 9) {
        R(g, x + i, y - 6, 5, 6, '#7a6c70');
        R(g, x + i + 4, y - 6, 1, 6, '#5e5258');
        R(g, x + i, y - 6, 5, 1, '#9a8c90');
      }
    };
    const tower = (tx, tw, ty) => {
      masonry(tx, ty, tw, GY - ty, tx);
      R(g, tx, ty, 1, GY - ty, '#5a4e54');
      R(g, tx + tw - 1, ty, 1, GY - ty, '#9a8c90');
      crenel(tx, tw, ty);
      for (let yy = ty + 16; yy < GY - 40; yy += 34) {
        R(g, tx + tw / 2 - 1, yy, 2, 7, '#2a2026');
      }
      S.flags.push({ x: tx + Math.floor(tw / 2), y: ty - 6 });
    };
    // gövde
    masonry(x0, top, x1 - x0, GY - top, 3);
    crenel(x0, x1 - x0, top);
    // kuleler
    tower(x0, 44, 60);
    for (let tx = x0 + 150; tx < x1; tx += 150) {
      if (Math.abs(tx + 22 - gx) < 130) continue;
      tower(tx, 44, 60);
    }
    tower(gx - 92, 50, 52);
    tower(gx + 42, 50, 52);
    // kapı
    const aw = 56, at = 118;
    for (let dy = 0; dy < aw / 2 + 5; dy++) {
      const hw = Math.round(Math.sqrt((aw / 2 + 5) ** 2 - dy * dy));
      for (let xx = gx - hw; xx < gx + hw; xx++) P(g, xx, at - dy, Math.floor((Math.atan2(at - dy - at, xx - gx) + 4) * 4) % 2 ? '#8e4a3a' : '#9a8c90');
    }
    R(g, gx - aw / 2 - 5, at, aw + 10, GY - at, '#9a8c90');
    paint(g, gx - aw / 2, at - aw / 2, aw, GY - at + aw / 2, (x, y) => {
      if (y < at) {
        const dy = at - y, hw = Math.sqrt((aw / 2) ** 2 - dy * dy);
        if (!(Math.abs(x - gx) < hw)) return null;
      }
      const t = (y - (at - aw / 2)) / (GY - at + aw / 2);
      if (y > GY - 18) return t * 1.2 > bayer(x, y) + 0.4 ? '#c88a58' : '#d89a62';
      if (y > GY - 26 && Math.abs(x - gx) > 6 + hash(x, 3) * 10) return '#d9776a';
      return t > bayer(x, y) * 0.5 + 0.35 ? '#f6b866' : '#fde0a0';
    });
    for (const s of [-1, 1]) {
      R(g, gx + s * (aw / 2 - 3) - (s > 0 ? 3 : 0), at - 6, 6, GY - at + 6, '#4a2c20');
      for (let yy = at; yy < GY; yy += 6) P(g, gx + s * (aw / 2 - 2) - (s > 0 ? 1 : 0), yy, '#c9a24a');
    }
    near.wallTorch(g, gx - 44, 132, S);
    near.wallTorch(g, gx + 44, 132, S);
    S.gate = { x: gx, y: at, w: aw };
    for (let tx = x0 + 150; tx < x1; tx += 150) {
      if (Math.abs(tx + 22 - gx) < 130) continue;
      near.wallTorch(g, tx + 22, GY - 70, S);
      if (tx + 100 < x1 && Math.abs(tx + 100 - gx) > 120) near.banner(g, tx + 90, top + 2, 46);
    }
    near.banner(g, gx - 86, 54, 54);
    near.banner(g, gx + 70, 54, 54);
    for (let bx = x0 + 60; bx < x1 - 20; bx += 115) {
      if (Math.abs(bx - gx) < 75) continue;
      near.brazier(g, bx, S);
    }
    near.brazier(g, gx - 52, S);
    near.brazier(g, gx + 52, S);
  }

  // ---------- Zemin ----------
  function ground(g, w) {
    R(g, 0, GY - 2, w, AH - GY + 2, '#2a2026');
    R(g, 0, GY - 2, w, 1, '#4e3e40');
    const rows = [3, 3, 4, 4, 5, 5, 6, 7];
    let y = GY;
    rows.forEach((h, ri) => {
      let x = -Math.floor(hash(ri, 1) * 8);
      while (x < w) {
        const d = district(x * PX);
        let sw, c;
        const v = hash(x, y);
        if (d === 'cami') {
          sw = 14 + Math.floor(v * 10);
          c = v < 0.3 ? '#6e6266' : v < 0.7 ? '#7a6e72' : '#86797c';
        } else if (d === 'bostan' || d === 'sur') {
          sw = 4 + Math.floor(v * 5);
          c = v < 0.4 ? '#5e4838' : v < 0.8 ? '#664e3c' : '#76604c';
        } else {
          sw = 4 + Math.floor(v * 4) + Math.floor(ri / 2);
          c = v < 0.3 ? '#463638' : v < 0.7 ? '#504040' : '#5c4a46';
        }
        R(g, x, y, sw - 1, h - 1, c);
        R(g, x, y, Math.max(1, sw - 3), 1, lt(c, 0.14));
        R(g, x + sw - 2, y + 1, 1, h - 2, dk(c, 0.18));
        x += sw;
      }
      y += h;
    });
    // su birikintileri ve tekerlek izleri
    for (let x = 30; x < w; x += 90 + Math.floor(hash(x, 9) * 140)) {
      const d = district(x * PX);
      if (d === 'mahalle' || d === 'carsi') {
        const py = GY + 10 + Math.floor(hash(x, 4) * 18), pw = 10 + Math.floor(hash(x, 5) * 10);
        for (let j = 0; j < 2; j++) R(g, x + j * 2, py + j, pw - j * 4, 1, j === 0 ? '#6a2a34' : '#3a1c26');
        R(g, x + 3, py, 3, 1, '#c84a3a');
      } else if (d === 'bostan' || d === 'sur') {
        R(g, x, GY + 12, 60, 1, '#4a382c');
        R(g, x + 6, GY + 24, 60, 1, '#4a382c');
      }
    }
  }

  // Sokak süsleri (fıçı, sandık, çuval)
  function props(g, w, S) {
    for (let x = 40; x < w; x += 70 + Math.floor(hash(x, 2) * 120)) {
      const d = district(x * PX);
      if (d === 'sur' || d === 'cami') continue;
      const k = hash(x, 7);
      if (k < 0.3) {
        R(g, x, GY - 11, 8, 11, '#6a4428');
        R(g, x + 6, GY - 11, 2, 11, '#8a5e38');
        R(g, x, GY - 9, 8, 1, '#3a2a22');
        R(g, x, GY - 3, 8, 1, '#3a2a22');
        R(g, x + 1, GY - 12, 6, 1, '#4a3020');
      } else if (k < 0.55) {
        R(g, x, GY - 8, 12, 8, '#7a5634');
        R(g, x, GY - 8, 12, 1, '#9a7448');
        R(g, x + 5, GY - 8, 1, 8, '#5a3e26');
        if (d === 'carsi') for (let i = 0; i < 4; i++) P(g, x + 2 + i * 3, GY - 9, '#e8802a');
      } else if (k < 0.75) {
        blob(g, x + 5, GY - 5, 5, 5, ['#8a7254', '#a88c66', '#c8ac80'], x);
        R(g, x + 4, GY - 11, 2, 2, '#6a5434');
      }
    }
  }

  function genNear(w, S) {
    const L = mk(w, AH), g = L.g, r = K.seeded(1453);
    const gx = Math.round(K.GATE_X / PX);
    const wallX = Math.floor((K.GATE_X - 1150) / PX);
    let x = -10, sinceLamp = 0, portalDone = false;
    const fronts = [];
    const later = [];
    while (x < wallX) {
      const d = district(x * PX);
      const k = r();
      let used = 0;
      if (d === 'mahalle') {
        if (k < 0.4) {
          used = 50 + Math.floor(r() * 26);
          near.houseFront(g, x, used, r, S);
          if (r() < 0.3) later.push(['torch', x + 6, GY - 32]);
        } else if (k < 0.7) {
          used = 40 + Math.floor(r() * 30);
          near.gardenWall(g, x, used, r, S);
        } else if (k < 0.82) {
          near.cesme(g, x + 4);
          used = 44;
        } else {
          used = 14 + Math.floor(r() * 8);
          near.alley(g, x, used, r);
        }
      } else if (d === 'carsi') {
        if (k < 0.15) {
          near.hanGate(g, x, r, S);
          used = 72;
          later.push(['banner', x + 6, 90, 34], ['banner', x + 50, 90, 34]);
        } else {
          used = 44 + Math.floor(r() * 14);
          near.shop(g, x, used, r, S);
          if (r() < 0.3) later.push(['brazier', x + used]);
        }
      } else if (d === 'cami') {
        if (!portalDone && x * PX > 11600) {
          near.portal(g, x, r, S);
          portalDone = true;
          used = 58;
          later.push(['torch', x + 3, GY - 50], ['torch', x + 54, GY - 50]);
        } else {
          used = 64;
          near.courtyard(g, x, used, r, S);
          if (r() < 0.6) fronts.push([x + 64, 74 + Math.floor(r() * 20)]);
        }
      } else {
        used = near.bostan(g, x, r, S);
        if (r() < 0.12) later.push(['camp', x + used + 6]);
      }
      sinceLamp += used;
      if (sinceLamp > 110 && d !== 'cami' && d !== 'bostan') {
        near.lamp(g, x + used - 3, S);
        sinceLamp = 0;
      }
      x += used;
    }
    for (const [cx, ch] of fronts) cypressAt(g, cx, GY, ch, 7, ['#1a2c22', '#2c4634', '#5a7a4c']);
    for (const [k, a, b, c] of later) {
      if (k === 'torch') near.wallTorch(g, a, b, S);
      else if (k === 'brazier') near.brazier(g, a, S);
      else if (k === 'camp') near.campfire(g, a, S);
      else if (k === 'banner') near.banner(g, a, b, c);
    }
    cityWalls(g, wallX, w, gx, S);
    ground(g, w);
    props(g, wallX, S);
    haze(L, '#0e0a1a', y => (y < GY ? 0.58 : 0.4), 0, true);
    // kapıdan sokağa düşen ışık
    if (S.gate) {
      paint(g, gx - 140, GY - 1, 280, AH - GY + 1, (x, y) => {
        const spread = 28 + (y - GY) * 3.2;
        const dx = Math.abs(x - gx);
        if (dx > spread) return null;
        const t = (1 - dx / spread) * (1 - (y - GY) / 60);
        return t > bayer(x, y) + 0.15 ? '#c8885a' : null;
      });
    }
    return L;
  }

  // ---------- Canlı efekt hareketli parçaları ----------
  function glowSprite(rad, col) {
    const L = mk(rad * 2 + 1, rad * 2 + 1);
    paint(L.g, 0, 0, L.w, L.h, (x, y) => {
      const d = Math.hypot(x - rad, y - rad) / rad;
      if (d > 1) return null;
      const v = d < 0.28 ? 0.85 : Math.pow(1 - d, 1.8) * 0.7;
      return v > bayer(x, y) ? col : null;
    });
    return L;
  }

  function genFog(w, h, col, dens, seed) {
    const L = mk(w, h);
    const r = K.seeded(seed);
    const bumps = [];
    for (let i = 0; i < 14; i++) bumps.push({ x: r() * w, rx: 30 + r() * 70, a: 0.4 + r() * 0.6 });
    paint(L.g, 0, 0, w, h, (x, y) => {
      let v = 0;
      for (const b of bumps) {
        for (const o of [-w, 0, w]) {
          const dx = (x - b.x - o) / b.rx;
          if (Math.abs(dx) < 1) v = Math.max(v, (1 - dx * dx) * b.a);
        }
      }
      const vy = Math.sin((y / h) * Math.PI);
      return v * vy * dens > bayer(x, y) + 0.05 ? col : null;
    });
    return L;
  }

  // En önde, karakterlerin önünde kalan koyu silüetler
  function genFore(w) {
    const L = mk(w, AH), g = L.g, r = K.seeded(77);
    const C = '#06040a', C2 = '#120c16', rim = '#3a1820';
    let x = 160;
    while (x < w) {
      const k = r();
      if (k < 0.35) {
        const n = 3 + Math.floor(r() * 4);
        for (let i = 0; i < n; i++) {
          const px = x + i * 10, h = 22 + Math.floor(r() * 18);
          R(g, px, AH - h, 4, h, C);
          R(g, px + 1, AH - h - 2, 2, 2, C);
          R(g, px + 3, AH - h, 1, Math.round(h * 0.5), rim);
        }
        R(g, x - 3, AH - 15, n * 10 + 4, 3, C);
        x += n * 10;
      } else if (k < 0.6) {
        blob(g, x + 22, AH + 6, 28, 20, [C, C2, rim], x);
        x += 50;
      } else if (k < 0.82) {
        for (let i = 0; i < 16; i++) {
          const h = 6 + Math.floor(r() * 14);
          for (let j = 0; j < h; j++) P(g, x + i * 2 + Math.round((j / h) * (r() < 0.5 ? -2 : 2)), AH - j, j > h - 3 ? rim : C);
        }
        x += 34;
      } else {
        const cx = x + 14, cy = AH - 4;
        for (let a = 0; a < 64; a++) {
          const ang = (a / 64) * Math.PI * 2;
          P(g, cx + Math.cos(ang) * 13, cy + Math.sin(ang) * 13, C);
          P(g, cx + Math.cos(ang) * 12, cy + Math.sin(ang) * 12, C);
        }
        for (let s2 = 0; s2 < 6; s2++) line(g, cx, cy, cx + Math.round(Math.cos(s2) * 12), cy + Math.round(Math.sin(s2) * 12), C);
        x += 30;

'use strict';
// Karakterleri tam çözünürlükte çizer: koyu dış hat, ışık tarafında kenar ışığı, karşı tarafta gölge.

      g.fillStyle = r() < 0.6 ? `rgba(0,0,0,${0.08 + r() * 0.18})` : `rgba(255,230,200,${0.04 + r() * 0.08})`;

      g.restore();

      og.clearRect(0, 0, W, H);
