  const RANGED = {
    yay: { name: 'Yay' },
    tabanca: { name: 'Tabanca' },
    cirit: { name: 'Cirit' },
  };
  K.WEAPON_NAMES = { kilic: 'Kılıç', mizrak: 'Mızrak', yay: 'Yay', tabanca: 'Tabanca', cirit: 'Cirit' };

  class Player {
    constructor(x) {
      this.look = K.LOOKS.karamani;
      this.team = 'player';
      this.reset(x);
      this.melee = ['kilic', 'mizrak'];
      this.ranged = ['yay', 'tabanca', 'cirit'];
      this.dur = { kilic: 1, mizrak: 1, yay: 1, tabanca: 1, cirit: 1 };
      this.broken = {};
      this.mi = 0;
      this.ri = 0;
      this.maxCombo = 0;
    }
    reset(x) {
      this.x = x;
      this.y = K.GROUND;
      this.vx = this.vy = 0;
      this.facing = 1;
      this.onGround = true;
      this.maxHp = 420;
      this.hp = this.maxHp;
      this.dead = false;
      this.state = 'idle';
      this.st = 0;
      this.jumps = 0;
      this.airDash = true;
      this.atk = null;
      this.hitSet = new Set();
      this.buf = null;
      this.bufT = 0;
      this.inv = 0;
      this.flash = 0;
      this.combo = 0;
      this.comboT = 0;
      this.akin = 0;
      this.dodgeCd = 0;
      this.pistolReload = 0;
      this.javelins = 3;
      this.javT = 0;
      this.drawAmt = 0;
      this.anim = 0;
      this.ctrl = true;
      this.pose = STANCE;
    }
    get meleeW() { return this.melee[this.mi]; }
    get rangedW() { return this.ranged[this.ri]; }
    hurtbox() {
      if (this.state === 'down') return { x: this.x - 40, y: this.y - 30, w: 80, h: 30 };
      return { x: this.x - 17, y: this.y - 112, w: 34, h: 112 };
    }
    setState(s) {
      this.state = s;
      this.st = 0;
    }
    queue(a) {
      this.buf = a;
      this.bufT = 0.2;
    }
    take(a) {
      if (this.buf === a) {
        this.buf = null;
        return true;
      }
      return false;
    }

    update(dt) {
      const I = K.input, G = K.game;
      this.st += dt;
      this.anim += dt;
      this.inv = Math.max(0, this.inv - dt);
      this.flash = Math.max(0, this.flash - dt);
      this.dodgeCd = Math.max(0, this.dodgeCd - dt);
      this.bufT -= dt;
      if (this.bufT <= 0) this.buf = null;
      this.comboT -= dt;
      if (this.comboT <= 0) this.combo = 0;
      if (this.pistolReload > 0) {
        this.pistolReload -= dt;
        if (this.pistolReload <= 0) {
          K.sfx('clang', 0.6);
          K.fx.text(this.x, this.y - 140, 'Dolduruldu', '#d8e6ff', 14, 0.6);
        }
      }
      if (this.javelins < 3) {
        this.javT += dt;
        if (this.javT >= 3.2) {
          this.javT = 0;
          this.javelins++;
        }
      }

      const canAct = this.ctrl && G.state === 'play' && !this.dead;
      if (canAct) {
        if (I.hit('attack')) this.queue('attack');
        if (I.hit('heavy')) this.queue('heavy');
        if (I.hit('jump')) this.queue('jump');
        if (I.hit('dodge')) this.queue('dodge');
        if (I.hit('super')) this.queue('super');
        if (I.hit('ranged')) this.queue('ranged');
        if (I.hit('swapMelee')) this.swap('melee');
        if (I.hit('swapRanged')) this.swap('ranged');
      }
      const mx = canAct ? (I.held('right') ? 1 : 0) - (I.held('left') ? 1 : 0) : 0;
      let grav = 1;

      switch (this.state) {
        case 'idle':
        case 'run':
        case 'air':
          this.free(dt, mx);
          break;
        case 'attack':
          grav = this.updateAttack(dt, mx);
          break;
        case 'plunge':
          this.vx = K.approach(this.vx, 0, 600 * dt);
          if (this.onGround) this.landPlunge();
          break;
        case 'plungeRec':
          this.vx = 0;
          if (this.st > 0.22) this.setState('idle');
          break;
        case 'bow':
          grav = this.updateBow(dt, mx);
          break;
        case 'shoot':
          this.vx = K.approach(this.vx, 0, 2000 * dt);
          if (this.st > 0.28) this.setState(this.onGround ? 'idle' : 'air');
          break;
        case 'throw':
          this.vx = K.approach(this.vx, 0, 2000 * dt);
          if (!this.thrown && this.st > 0.13) {
            this.thrown = true;
            this.fireJavelin();
          }
          if (this.st > 0.34) this.setState(this.onGround ? 'idle' : 'air');
          break;
        case 'dodge':
          grav = this.onGround ? 1 : 0.15;
          this.vx = this.dodgeDir * (this.st < 0.22 ? 640 : 260);
          if (this.st > 0.3) this.setState(this.onGround ? 'idle' : 'air');
          break;
        case 'hurt':
          this.vx = K.approach(this.vx, 0, 1600 * dt);
          if (this.st > this.stunT) {
            this.inv = 0.3;
            this.setState(this.onGround ? 'idle' : 'air');
          }
          break;
        case 'down':
          if (this.onGround) this.vx = K.approach(this.vx, 0, 1400 * dt);
          if (this.st > 0.7 && this.onGround) {
            this.setState('getup');
            this.inv = 0.9;
          }
          break;
        case 'getup':
          if (this.st > 0.32) this.setState('idle');
          break;
        case 'akin':
          grav = 0;
          this.updateAkin(dt);
          break;
        case 'dead':
          if (this.onGround) this.vx = K.approach(this.vx, 0, 900 * dt);
          break;
        case 'cinematic':
          this.vx = K.approach(this.vx, 0, 2000 * dt);
          break;
      }

      // Fizik
      if (!this.onGround || this.vy < 0) this.vy += K.GRAV * grav * dt;
      this.x += this.vx * dt;
      this.y += this.vy * dt;
      if (this.y >= K.GROUND) {
        if (!this.onGround && this.vy > 500) K.fx.dust(this.x, K.GROUND, 5);
        this.y = K.GROUND;
        this.vy = 0;
        if (!this.onGround) {
          this.onGround = true;
          this.jumps = 0;
          this.airDash = true;
          if (this.state === 'air') this.setState('idle');
          if (this.state === 'attack' && this.atk && this.atk.air) this.setState('idle');
        }
      } else if (this.y < K.GROUND - 0.5) {
        this.onGround = false;
      }
      const b = G.bounds;
      this.x = K.clamp(this.x, b.min + 24, b.max - 24);
      this.computePose();
    }

    free(dt, mx) {
      const run = 400;
      if (this.onGround) this.vx = K.approach(this.vx, mx * run, (mx ? 3600 : 3000) * dt);
      else this.vx = K.approach(this.vx, mx * run, 2200 * dt);
      if (mx) this.facing = mx;

      if (this.take('jump')) {
        if (this.onGround) {
          this.vy = -930;
          this.onGround = false;
          this.jumps = 1;
          K.fx.dust(this.x, K.GROUND, 6);
          K.sfx('jump');
        } else if (this.jumps < 2) {
          this.vy = -820;
          this.jumps = 2;
          K.fx.add({ type: 'ring', x: this.x, y: this.y, size: 50, life: 0.3, color: 'rgba(255,240,200,0.8)' });
          K.sfx('jump');
        }
      }
      if (this.take('dodge') && this.dodgeCd <= 0 && (this.onGround || this.airDash)) {
        this.dodgeDir = mx || this.facing;
        this.facing = this.dodgeDir;
        if (!this.onGround) {
          this.airDash = false;
          this.vy = 0;
        }
        this.inv = 0.26;
        this.dodgeCd = 0.38;
        this.setState('dodge');
        K.sfx('dash');
        K.fx.dust(this.x, this.y, 4);
        return;
      }
      if (this.take('super') && this.akin >= 100) {
        this.startAkin();
        return;
      }
      if (this.take('attack')) {
        const I = K.input;
        const w = this.meleeW;
        if (!this.onGround && I.held('down')) {
          this.startPlunge();
          return;
        }
        if (this.onGround && I.held('up')) return this.startAttack(w + '_launch');
        return this.startAttack(this.onGround ? w + '_1' : w + '_a1');
      }
      if (this.take('heavy')) {
        if (!this.onGround) return this.startPlunge();
        return this.startAttack(this.meleeW + '_heavy');
      }
      if (this.take('ranged')) return this.startRanged();

      if (this.onGround) this.setStateSoft(Math.abs(this.vx) > 30 ? 'run' : 'idle');
      else this.setStateSoft('air');
    }
    setStateSoft(s) {
      if (this.state !== s) {
        this.state = s;
        this.st = 0;
      }
    }

    swap(kind) {
      if (kind === 'melee') this.mi = (this.mi + 1) % this.melee.length;
      else this.ri = (this.ri + 1) % this.ranged.length;
      K.sfx('ui');
      const w = kind === 'melee' ? this.meleeW : this.rangedW;
      K.fx.text(this.x, this.y - 150, K.WEAPON_NAMES[w], '#f3e2b0', 16, 0.7);
    }

    // ---------- Yakın dövüş ----------
    startAttack(id) {
      const a = A[id];
      if (!a) return;
      const I = K.input;
      const mx = (I.held('right') ? 1 : 0) - (I.held('left') ? 1 : 0);
      if (mx) this.facing = mx;
      this.atk = a;
      this.hitSet = new Set();
      this.setState('attack');
      this.swung = false;
      if (a.air) {
        this.vy = Math.min(this.vy, -150);
      }
    }
    updateAttack(dt, mx) {
      const a = this.atk;
      const t = this.st;
      let grav = 1;
      if (a.air) grav = 0.25;
      // İleri atılma
      if (a.dash && t >= a.startup && t < a.startup + a.active) {
        this.vx = this.facing * a.dash;
      } else if (this.onGround) {
        if (t < a.startup + a.active && a.lunge) this.vx = K.approach(this.vx, this.facing * a.lunge, 4000 * dt);
        else this.vx = K.approach(this.vx, 0, 2600 * dt);
      } else {
        this.vx = K.approach(this.vx, 0, 900 * dt);
      }
      if (t >= a.startup && !this.swung) {
        this.swung = true;
        K.sfx(a.sfx);
        this.spawnTrail(a);
      }
      if (t >= a.startup && t < a.startup + a.active) {
        const r = this.attackRect(a);
        const n = K.strike('player', r, this.hitParams(a), this.hitSet);
        if (n && a.spike) this.vy = -200;
      }
      const done = a.startup + a.active;
      // Kombo devamı
      if (t >= done) {
        if (a.next && this.buf === 'attack' && !(K.input.held('up') && this.onGround)) {
          if (!a.air || !this.onGround) {
            this.buf = null;
            this.startAttack(a.next);
            return grav;
          }
        }
        if (this.buf === 'heavy' && this.onGround && !a.id.endsWith('heavy')) {
          this.buf = null;
          this.startAttack(this.meleeW + '_heavy');
          return grav;
        }
        if (this.buf === 'dodge' && this.dodgeCd <= 0) {
          this.setState('idle');
          this.free(dt, mx);
          return grav;
        }
        if (a.jumpCancel && this.buf === 'jump') {
          this.buf = null;
          this.vy = -1000;
          this.onGround = false;
          this.jumps = 1;
          this.setState('air');
          return grav;
        }
        if (this.buf === 'attack' && !a.next && t >= done + a.recovery * 0.5) {
          this.setState(this.onGround ? 'idle' : 'air');
          this.free(dt, mx);
          return grav;
        }
      }
      if (t >= done + a.recovery) this.setState(this.onGround ? 'idle' : 'air');
      return grav;
    }
    attackRect(a) {
      const s = this.look.scale;
      const front = a.reach * s, back = a.back * s;
      return this.facing > 0
        ? { x: this.x - back, y: this.y + a.hy * s, w: front + back, h: a.hh * s }
        : { x: this.x - front, y: this.y + a.hy * s, w: front + back, h: a.hh * s };
    }
    hitParams(a) {
      return {
        dmg: a.dmg,
        dir: this.facing,
        kb: a.kb,
        launch: a.launch,
        float: a.float,
        spike: a.spike,
        stun: a.stun,
        knockdown: a.knockdown,
        guardBreak: a.guardBreak,
        poise: a.poise || 1,
        heavy: a.sfx === 'heavy',
        src: this,
        onHit: (t, r) => this.onDealt(a.dmg, t, r, a),
      };
    }
    spawnTrail(a) {
      const s = this.look.scale;
      const sx = this.x + this.facing * 6 * s, sy = this.y - 95 * s;
      if (a.arc) {
        K.fx.add({ type: 'arc', x: sx, y: sy, dir: this.facing, a0: a.arc[0], a1: a.arc[1], r: a.arc[2] * s, width: a.arcW || 12, life: 0.16, color: this.meleeW === 'mizrak' ? 'rgba(255,236,190,0.85)' : 'rgba(235,245,255,0.95)' });
      }
      if (a.thrust) {
        const y = this.y + (a.hy + a.hh / 2) * s;
        K.fx.add({ type: 'line', x: this.x + this.facing * 30, y, x2: this.x + this.facing * a.reach * s * 1.05, y2: y, size: 8, life: 0.14, color: 'rgba(240,248,255,0.9)' });
      }
    }
    onDealt(dmg, t, r, a) {
      const G = K.game;
      if (r === 'blocked') {
        G.hitstop = Math.max(G.hitstop, 0.04);
        return;
      }
      this.combo++;
      this.comboT = 2.2;
      this.maxCombo = Math.max(this.maxCombo, this.combo);
      this.akin = Math.min(100, this.akin + dmg * 0.16);
      const w = a && a.weapon ? a.weapon : this.meleeW;
      this.wear(w, dmg / 3500);
      const heavy = a && (a.knockdown || a.sfx === 'heavy');
      G.hitstop = Math.max(G.hitstop, heavy ? 0.085 : 0.05);
      K.cam.shake(heavy ? 7 : 3, heavy ? 0.16 : 0.08);
    }
    wear(w, amt) {
      this.dur[w] = Math.max(0.12, this.dur[w] - amt);
    }

    // ---------- Dalış ----------
    startPlunge() {
      this.setState('plunge');
      this.vy = 1500;
      this.vx = this.facing * 80;
      this.hitSet = new Set();
      K.sfx('dash');
    }
    landPlunge() {
      const s = this.look.scale;
      const r = { x: this.x - 130, y: this.y - 70 * s, w: 260, h: 70 * s };
      K.strike('player', r, { dmg: 24, dir: this.facing, kb: 320, launch: 420, stun: 0.6, knockdown: true, heavy: true, poise: 2, src: this, onHit: (t, res) => this.onDealt(24, t, res, { knockdown: true }) }, this.hitSet);
      K.fx.add({ type: 'ring', x: this.x, y: K.GROUND, size: 160, life: 0.35, color: 'rgba(255,230,190,0.9)' });
      K.fx.dust(this.x, K.GROUND, 14, 2);
      K.cam.shake(8, 0.18);
      K.sfx('heavy');
      this.setState('plungeRec');
    }

    // ---------- Menzilli ----------
    startRanged() {
      const w = this.rangedW;
      const I = K.input;
      const mx = (I.held('right') ? 1 : 0) - (I.held('left') ? 1 : 0);
      if (mx) this.facing = mx;
      if (w === 'yay') {
        this.drawAmt = 0;
        this.setState('bow');
      } else if (w === 'tabanca') {
        if (this.pistolReload > 0) {
          K.fx.text(this.x, this.y - 140, 'Dolduruluyor…', '#aab4c8', 14, 0.5);
          return;
        }
        this.setState('shoot');
        this.firePistol();
      } else if (w === 'cirit') {
        if (this.javelins <= 0) {
          K.fx.text(this.x, this.y - 140, 'Cirit yok', '#aab4c8', 14, 0.5);
          return;
        }
        this.thrown = false;
        this.setState('throw');
      }
    }
    updateBow(dt, mx) {
      const I = K.input;
      this.drawAmt = Math.min(1, this.drawAmt + dt / 0.65);
      this.vx = K.approach(this.vx, mx * 120, 2400 * dt);
      if (this.take('dodge')) {
        this.setState('idle');
        this.queue('dodge');
        return 1;
      }
      if (!I.held('ranged') || !this.ctrl) {
        this.fireArrow();
        this.setState('shoot');
        this.st = 0.16;
        return 1;
      }
      return this.onGround ? 1 : 0.35;
    }
    handPos() {
      const s = this.look.scale;
      return { x: this.x + this.facing * 38 * s, y: this.y - 96 * s };
    }
    fireArrow() {
      const d = this.drawAmt;
      const h = this.handPos();
      K.game.addProj(new K.Proj({
        kind: 'arrow', team: 'player', x: h.x, y: h.y, vx: this.facing * (1100 + d * 1000), vy: -40 * (1 - d), grav: 260,
        dmg: Math.round(10 + d * 30), kb: 80 + d * 240, stun: 0.3 + d * 0.2, pierce: d > 0.85 ? 3 : 1, knockdown: d > 0.95,
        onHit: (t, r) => this.onDealt(10 + d * 30, t, r, { weapon: 'yay' }),
      }));
      this.wear('yay', 0.004);
      K.sfx('bow');
      if (d > 0.95) K.fx.add({ type: 'ring', x: h.x, y: h.y, size: 30, life: 0.2, flat: 1, color: 'rgba(255,240,190,0.9)' });
    }
    firePistol() {
      const h = this.handPos();
      K.game.addProj(new K.Proj({
        kind: 'bullet', team: 'player', x: h.x, y: h.y, vx: this.facing * 2700, vy: 0, grav: 0,
        dmg: 50, kb: 480, stun: 0.6, knockdown: true, pierce: 1, guardBreak: true, poise: 3,
        onHit: (t, r) => this.onDealt(50, t, r, { weapon: 'tabanca', knockdown: true }),
      }));
      this.pistolReload = 2.4;
      this.wear('tabanca', 0.02);
      K.fx.smoke(h.x + this.facing * 26, h.y, this.facing, 12);
      K.fx.sparks(h.x + this.facing * 28, h.y, this.facing, 8, '#ffcf6a', 700);
      K.cam.shake(6, 0.12);
      K.sfx('shot');
      this.vx = -this.facing * 160;
    }
    fireJavelin() {
      const h = this.handPos();
      this.javelins--;
      K.game.addProj(new K.Proj({
        kind: 'javelin', team: 'player', x: h.x, y: h.y - 10, vx: this.facing * 1500, vy: -140, grav: 520,
        dmg: 34, kb: 340, stun: 0.6, knockdown: true, pierce: 3, guardBreak: true, poise: 2,
        onHit: (t, r) => this.onDealt(34, t, r, { weapon: 'cirit', knockdown: true }),
      }));
      this.wear('cirit', 0.01);
      K.sfx('throw');
    }

    // ---------- Akın (özel güç) ----------
    startAkin() {
      this.akin = 0;
      this.setState('akin');
      this.akinStep = 0;
      this.inv = 2;
      this.vx = this.vy = 0;
      K.game.flash = 0.35;
      K.game.slowmo = 0.5;
      K.sfx('horn');
      K.fx.text(this.x, this.y - 170, 'AKIN!', '#ffcf6a', 34, 1.1);
    }
    updateAkin(dt) {
      const times = [0.15, 0.45, 0.75, 1.05];
      this.vy = 0;
      if (this.akinStep < times.length && this.st >= times[this.akinStep]) {
        const b = K.game.bounds;
        const from = this.x;
        let to = from + this.facing * 520;
        if (to < b.min + 60 || to > b.max - 60) {
          this.facing *= -1;
          to = from + this.facing * 520;
        }
        to = K.clamp(to, b.min + 60, b.max - 60);
        this.x = to;
        const r = { x: Math.min(from, to) - 40, y: this.y - 150, w: Math.abs(to - from) + 80, h: 150 };
        K.strike('player', r, { dmg: 55, dir: this.facing, kb: 300, launch: 700, stun: 0.8, knockdown: true, guardBreak: true, poise: 3, heavy: true, src: this, onHit: (t, res) => this.onDealt(0, t, res, { knockdown: true }) }, new Set());
        const y = this.y - 80;
        K.fx.add({ type: 'line', x: from, y, x2: to, y2: y, size: 26, life: 0.3, color: 'rgba(255,214,140,0.95)' });
        K.fx.add({ type: 'line', x: from, y: y - 20, x2: to, y2: y - 20, size: 6, life: 0.4, color: 'rgba(255,255,255,0.9)' });
        K.cam.shake(10, 0.15);
        K.sfx('heavy');
        this.facing *= -1;
        this.akinStep++;
      }
      if (this.st > 1.3) {
        this.inv = 0.5;
        this.setState('idle');
      }
    }

    // ---------- Hasar alma ----------
    takeHit(p) {
      if (this.dead || this.inv > 0 || this.state === 'akin' || K.game.god) return false;
      if (this.state === 'dodge' && this.st < 0.26) return false;
      if (this.state === 'down' || this.state === 'getup') return false;
      this.hp -= p.dmg;
      this.flash = 0.12;
      this.combo = 0;
      this.akin = Math.min(100, this.akin + p.dmg * 0.3);
      K.fx.blood(this.x, this.y - 70, p.dir, 8);
      K.fx.number(this.x, this.y - 130, p.dmg, '#ff7a6a', 18);
      K.cam.shake(6, 0.15);
      K.game.hitstop = Math.max(K.game.hitstop, 0.06);
      K.sfx('hurt');
      if (this.hp <= 0) {
        this.hp = 0;
        this.dead = true;
        this.setState('dead');
        this.vx = p.dir * 300;
        this.vy = -500;
        this.onGround = false;
        K.game.onPlayerDeath();
        return 'hit';
      }
      if (p.knockdown) {
        this.setState('down');
        this.vx = p.dir * (p.kb || 300);
        this.vy = -380;
        this.onGround = false;
      } else {
        this.setState('hurt');
        this.stunT = Math.min(0.35, (p.stun || 0.3) * 0.7);
        this.vx = p.dir * (p.kb || 200) * 0.6;
      }
      if (p.dir) this.facing = -p.dir;
      return 'hit';
    }

    // ---------- Poz ----------
    computePose() {
      const melee = this.meleeW;
      const base = melee === 'mizrak' ? SPEAR_STANCE : STANCE;
      let pose = base;
      const t = this.st;
      this.weaponDrawn = melee;
      switch (this.state) {
        case 'idle': {
          pose = Object.assign({}, base, { bob: Math.sin(this.anim * 3) * 1.5 });
          break;
        }
        case 'run':
          pose = K.runPose(this.anim * 13, base);
          break;
        case 'air':
          pose = Object.assign({}, base, AIR_LEGS, { lean: 0.15 });
          if (this.jumps === 2 && t < 0.3) pose.rot = (t / 0.3) * Math.PI * 2;
          break;
        case 'attack': {
          const a = this.atk;
          if (t < a.startup) pose = K.lerpPose(base, a.wind, K.ease(t / a.startup));
          else if (t < a.startup + a.active) pose = K.lerpPose(a.wind, a.strike, Math.min(1, (t - a.startup) / (a.active * 0.6)));
          else pose = K.lerpPose(a.strike, base, K.clamp((t - a.startup - a.active) / a.recovery, 0, 1) ** 2);
          break;
        }
        case 'plunge':
          pose = P(Object.assign({ lean: 0.2, au: 1.0, af: 0.2, wa: 1.45 }, AIR_LEGS));
          break;
        case 'plungeRec':
          pose = P({ lean: 0.5, au: 0.9, af: 0.3, wa: 1.4, ft: 0.9, fs: -0.6, bt: -0.6, bs: -1.6, bob: 18 });
          break;
        case 'bow':
        case 'shoot':
        case 'throw':
          pose = this.rangedPose(t);
          break;
        case 'dodge':
          pose = P({ lean: 0.9, ft: 1.2, fs: -0.4, bt: 0.2, bs: -1.4, au: 0.6, af: 0.4, wa: 0.4, bob: 22, rot: this.onGround ? 0 : 0.2 });
          if (this.onGround) pose.rot = (t / 0.3) * Math.PI * 2;
          break;
        case 'hurt':
          pose = P({ lean: -0.35, au: -0.2, af: 0.5, wa: -1.2, ft: 0.4, bt: -0.4, head: -0.3 });
          break;
        case 'down':
        case 'dead':
          pose = P({ lean: -0.2, rot: -Math.PI / 2 * Math.min(1, t * 4), au: 2.0, af: 2.4, wa: -2, ft: 0.4, bt: 0.2, bob: 8 });
          break;
        case 'getup':
          pose = K.lerpPose(P({ rot: -Math.PI / 2, bob: 8 }), base, t / 0.32);
          break;
        case 'akin':
          pose = P({ lean: 0.6, au: 1.5, af: 1.5, wa: 0, ft: 1.0, fs: 0.3, bt: -0.8, bs: -0.9 });
          break;
        case 'cinematic':
          pose = Object.assign({}, base, { bob: Math.sin(this.anim * 3) * 1.5 });
          break;
      }
      this.pose = pose;
    }
    rangedPose(t) {
      const w = this.state === 'bow' || (this.state === 'shoot' && this.rangedW === 'yay') ? 'yay' : this.rangedW;
      this.weaponDrawn = w;
      if (w === 'yay') {
        return P({ lean: 0.05, au: 1.55, af: 1.57, wa: 0, ft: 0.35, fs: 0.1, bt: -0.35, bs: -0.4, draw: this.state === 'bow' ? this.drawAmt : 0 });
      }
      if (w === 'tabanca') {
        const k = Math.max(0, 1 - t / 0.2);
        return P({ lean: -0.05 * k, au: 1.55 + 0.25 * k, af: 1.6 + 0.6 * k, wa: -0.6 * k, bu: -0.3, bf: 0.2, ft: 0.35, bt: -0.35 });
      }
      // cirit
      if (t < 0.13) return P({ lean: -0.25, au: -2.3, af: -1.9, wa: -0.25, bu: 1.2, bf: 1.4, ft: 0.4, bt: -0.4 });
      return P({ lean: 0.4, au: 2.0, af: 1.6, wa: 0.1, bu: -0.6, bf: -0.3, ft: 0.8, fs: 0.3, bt: -0.6, bs: -0.7 });
    }

    // Piksel hattı için: yalnızca gövde (dünya koordinatı)
    rig(ctx) {
      let weapon = this.weaponDrawn;
      if (this.state === 'throw' && this.thrown) weapon = null;
      if (weapon && this.broken[weapon]) weapon = null;
      K.drawRig(ctx, this.x, this.y, this.facing, this.pose, this.look, weapon, this.flash > 0, { cape: { t: this.anim, v: Math.min(1, Math.abs(this.vx) / 420) } });
    }
    get hidden() {
      return this.inv > 0 && this.state !== 'akin' && this.state !== 'dodge' && !(this.flash > 0) && Math.floor(this.inv * 20) % 2 === 1;
    }
    drawFx(ctx) {
      if (this.state === 'bow' && this.drawAmt > 0.95) {
        const h = this.handPos();
        ctx.fillStyle = 'rgba(255,240,180,0.9)';
        ctx.beginPath();
        ctx.arc(h.x + this.facing * 20, h.y, 7 + Math.sin(this.anim * 30) * 3, 0, 7);
        ctx.fill();
      }
    }
  }
  K.ease = t => 1 - (1 - t) * (1 - t);
  K.Player = Player;
  K.ATTACKS = A;
  K.RANGED = RANGED;
})(window.K);

  <script>
/* ---- js/enemies.js ---- */
'use strict';
// Yeniçeriler, kıdemliler, ağa ve mermiler
(function (K) {

  K.defineLook('tufekcibasi', Object.assign({}, JAN, { scale: 1.1, coat: '#2c3428', trim: '#8a7a4a', beard: '#2a1e16', baldric: true, age: true }));
  K.defineLook('topuzcu', Object.assign({}, JAN, { scale: 1.32, coat: '#3a2c24', beard: '#1e1610', mail: true, shield: true, bracer: true, furMantle: '#2e2219', age: true, pauldron: true }));
  K.defineLook('bayraktar', Object.assign({}, JAN, { scale: 1.14, coat: '#5a1214', hat: 'kavuk', hatColor: '#5e1216', armor: 'leather' }));
  K.defineLook('aga', { scale: 1.45, coat: '#4c0a10', trim: '#b08a40', sash: '#9a7a3a', pants: '#1a1622', boots: '#3a2a1e', beard: '#140e0a', mustache: '#140e0a', hat: 'aga', hatColor: '#d6ccb8', mail: true, cape: '#1c0e16', capeLining: '#8a6a30', capeFur: '#3a2a1e', capeLen: 74, furMantle: '#3a2a1e', age: true, scar: true, pauldron: true, tattered: true });

  const STANCE = P({ lean: 0.14, bob: 5, ft: 0.6, fs: 0.1, bt: -0.35, bs: -0.48, au: 0.55, af: 1.2, wa: -0.5 });
  const SPEAR = P({ lean: 0.14, bob: 5, ft: 0.6, fs: 0.1, bt: -0.35, bs: -0.48, au: 0.75, af: 1.38, wa: -0.08 });
  const GUN = P({ lean: 0.05, au: 0.9, af: 1.2, wa: -1.2, ft: 0.25, bt: -0.25 });
  const AIM = P({ lean: 0.0, au: 1.5, af: 1.57, wa: 0, ft: 0.35, bt: -0.35, bs: -0.4 });

  // Hamle şablonları
  const SLASH = { windup: 0.42, active: 0.12, recover: 0.45, dmg: 20, reach: 95, hy: -125, hh: 100, kb: 240, stun: 0.3, wind: P({ lean: -0.1, au: 2.7, af: 3.0, wa: -2.0 }), strike: P({ lean: 0.35, au: 1.0, af: 0.7, wa: 0.6, ft: 0.6, fs: 0.2, bt: -0.4, bs: -0.6 }), lunge: 220, arc: [-2.0, 0.8, 70] };
  const THRUST = { windup: 0.55, active: 0.14, recover: 0.5, dmg: 24, reach: 150, hy: -115, hh: 50, kb: 260, stun: 0.3, wind: P({ lean: -0.15, au: 0.4, af: 1.1, wa: 0 }), strike: P({ lean: 0.4, au: 1.45, af: 1.57, wa: 0, ft: 0.75, fs: 0.3, bt: -0.6, bs: -0.7 }), lunge: 200, thrust: true };
  const BASH = { windup: 0.32, active: 0.1, recover: 0.4, dmg: 14, reach: 80, hy: -120, hh: 90, kb: 340, stun: 0.3, wind: P({ au: -0.6, af: 0.2, wa: -1.0 }), strike: P({ lean: 0.3, au: 1.4, af: 1.3, wa: -0.4, ft: 0.6, bt: -0.4 }), lunge: 160 };

  const TYPES = {
    kilicli: { hp: 62, speed: 210, look: 'kilicli', weapon: 'yatagan', base: STANCE, moves: { slash: SLASH }, range: 88 },
    mizrakli: { hp: 72, speed: 185, look: 'mizrakli', weapon: 'mizrak', base: SPEAR, moves: { slash: THRUST }, range: 140 },
    tufekli: { hp: 52, speed: 175, look: 'tufekli', weapon: 'tufek', base: GUN, gunner: true, moves: { slash: BASH }, range: 80 },
    kalkanli: { hp: 86, speed: 165, look: 'kalkanli', weapon: 'yatagan', base: STANCE, moves: { slash: Object.assign({}, SLASH, { windup: 0.5 }) }, range: 88, shield: true },
  };
  K.ENEMY_TYPES = TYPES;

  // ================= Mermiler =================
  class Proj {
    constructor(o) {
      Object.assign(this, { w: 16, h: 10, life: 3, grav: 0, pierce: 1, stun: 0.3, kb: 100, dmg: 10 }, o);
      this.hitSet = new Set();
      this.dead = false;

    update(dt) {
      this.t += dt;
      this.life -= dt;
      if (this.life <= 0) this.dead = true;
      if (this.stuck) return;
      if (this.kind === 'bomb') return this.updateBomb(dt);
      if (this.kind === 'wave') return this.updateWave(dt);
      this.vy += this.grav * dt;
      this.x += this.vx * dt;

      if (this.kind === 'bullet' || this.kind === 'ebullet') {
        if (Math.random() < 0.6) K.fx.add({ type: 'dot', x: this.x, y: this.y, size: 2, life: 0.15, color: 'rgba(255,220,150,0.8)' });

      if (this.y >= K.GROUND - 2) {

        if (this.kind === 'arrow' || this.kind === 'javelin') {
          this.stuck = true;
          this.life = 1.5;
        } else this.dead = true;

      }
      const r = { x: this.x - this.w / 2, y: this.y - this.h / 2, w: this.w, h: this.h };

      K.strike(this.team, r, {
        dmg: this.dmg, dir, kb: this.kb, stun: this.stun, knockdown: this.knockdown, guardBreak: this.guardBreak, poise: this.poise || 1, projectile: true, src: this,

          if (this.pierce <= 0) this.dead = true;

      if (this.x < b.min - 200 || this.x > b.max + 200) this.dead = true;

        K.fx.add({ type: 'ring', x: this.x, y: K.GROUND, size: 180, life: 0.4, color: 'rgba(255,190,90,0.9)' });
        K.fx.smoke(this.x, this.y - 20, 1, 10);
        K.fx.smoke(this.x, this.y - 20, -1, 10);
        K.fx.sparks(this.x, this.y - 10, 1, 14, '#ffb24a', 700);

    }

      this.x += this.vx * dt;
      if (Math.random() < 0.7) K.fx.dust(this.x, K.GROUND, 1, 0.6);

      if (this.x < b.min - 40 || this.x > b.max + 40) this.dead = true;
    }
    draw(ctx) {

      ctx.translate(this.x, this.y);
      const ang = this.stuck ? this.stuckAng : Math.atan2(this.vy, this.vx);
      if (!this.stuck) this.stuckAng = ang;
      if (this.stuck) ctx.globalAlpha = Math.min(1, this.life);
      switch (this.kind) {
        case 'arrow':
          ctx.rotate(ang);
          ctx.strokeStyle = '#7a5a3a';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(-34, 0);
          ctx.lineTo(4, 0);
          ctx.stroke();
          ctx.fillStyle = '#dfe6ee';
          ctx.beginPath();
          ctx.moveTo(4, -3);
          ctx.lineTo(12, 0);
          ctx.lineTo(4, 3);

          ctx.fillRect(-36, 1, 8, 2);
          break;
        case 'javelin':
          ctx.rotate(ang);
          K.drawWeapon(ctx, 'cirit', -30, 0, 0, false);
          break;
        case 'bullet':
        case 'ebullet':
          ctx.fillStyle = this.kind === 'bullet' ? '#fff3c4' : '#ffb08a';
          ctx.beginPath();
          ctx.arc(0, 0, 4, 0, 7);
          ctx.fill();
          break;
        case 'bomb':
          ctx.fillStyle = '#26221f';
          ctx.beginPath();
          ctx.arc(0, 0, 9, 0, 7);
          ctx.fill();
          if (this.landed) {
            const r = 120 * (1 - this.fuse / 0.55);
            ctx.strokeStyle = 'rgba(255,90,60,0.7)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.ellipse(0, 8, 120, 22, 0, 0, 7);
            ctx.stroke();
            ctx.fillStyle = 'rgba(255,90,60,0.18)';
            ctx.beginPath();
            ctx.ellipse(0, 8, r, r * 0.18, 0, 0, 7);
            ctx.fill();
          }
          break;
        case 'wave':
          ctx.fillStyle = 'rgba(200,170,130,0.75)';
          ctx.beginPath();
          ctx.moveTo(-22, 0);
          ctx.quadraticCurveTo(0, -60, 22, 0);
          ctx.fill();
          break;
      }
      ctx.restore();
    }
  }
  K.Proj = Proj;

  // ================= Temel düşman =================
  class Enemy {
    constructor(type, x, opts = {}) {
      const T = typeof type === 'string' ? TYPES[type] : type;
      this.T = T;
      this.type = opts.typeName || type;
      this.look = K.LOOKS[T.look];
      this.team = 'enemy';
      this.x = x;
      this.y = K.GROUND;
      this.vx = this.vy = 0;
      this.facing = x < K.game.player.x ? 1 : -1;
      this.maxHp = this.hp = T.hp;
      this.speed = T.speed * K.rand(0.9, 1.1);
      this.state = 'enter';
      this.st = 0;
      this.dead = false;
      this.remove = false;
      this.onGround = true;
      this.flash = 0;
      this.cd = K.rand(0.4, 1.4);
      this.token = false;
      this.ring = K.rand(150, 270);
      this.jitter = K.rand(0, 10);
      this.anim = K.rand(0, 5);
      this.poiseMax = T.poise || 0;
      this.poise = this.poiseMax;
      this.counted = opts.counted !== false;
      this.isBoss = false;
      this.blocks = 0;
      this.pose = T.base;
    }
    get player() { return K.game.player; }
    hurtbox() {
      const s = this.look.scale;
      if (this.state === 'down' || (this.dead && this.onGround)) return { x: this.x - 40 * s, y: this.y - 30, w: 80 * s, h: 30 };
      return { x: this.x - 18 * s, y: this.y - 112 * s, w: 36 * s, h: 112 * s };
    }
    setState(s) {
      this.state = s;
      this.st = 0;
    }
    releaseToken() {
      if (this.token) {
        this.token = false;
        K.game.tokens = Math.max(0, K.game.tokens - 1);
      }
    }
    // ---- Hasar ----
    takeHit(p) {
      if (this.dead) return false;
      if (this.state === 'getup' && this.st < 0.25) return false;
      const fromFront = K.sign(p.src ? p.src.x - this.x : -p.dir) === this.facing;
      // Kalkan: önden gelen hafif vuruşları keser
      if (this.T.shield && !p.guardBreak && fromFront && this.onGround && !['hurt', 'down', 'air', 'stagger', 'getup'].includes(this.state) && !this.state.startsWith('m_act')) {
        this.blocks++;
        K.fx.sparks(this.x + this.facing * 26, this.y - 80 * this.look.scale, -this.facing, 7, '#fff2c0');
        K.sfx('clang');
        this.vx = p.dir * 120;
        if (this.blocks >= 4) {
          this.blocks = 0;
          this.stagger(0.9);
        }
        return p.projectile ? 'blocked' : 'blocked';
      }
      const dmg = p.dmg;
      this.hp -= dmg;
      this.flash = 0.1;
      K.fx.number(this.x, this.y - 125 * this.look.scale, dmg, dmg >= 30 ? '#ffd36a' : '#fff1c8', dmg >= 30 ? 22 : 16);
      K.fx.blood(this.x, this.y - 75 * this.look.scale, p.dir, dmg >= 30 ? 16 : 9);
      K.fx.spray(this.x, this.y - 80 * this.look.scale, p.dir, dmg >= 30 ? 16 : 9, dmg >= 30 ? 1.3 : 1);
      K.fx.sparks(this.x, this.y - 80 * this.look.scale, p.dir, 5);
      K.sfx(p.heavy ? 'heavy' : 'hit');
      if (this.hp <= 0) {
        this.die(p);
        return 'hit';
      }
      // Yerde yatana vuruş: yerde tutar
      if (this.state === 'down' && !p.launch) {
        this.st = Math.min(this.st, 0.35);
        this.vx = p.dir * 90;
        return 'hit';
      }
      // Dayanıklılık (kıdemliler ve ağa)
      if (this.poiseMax > 0) {
        this.poise -= dmg * (p.poise || 1);
        if (this.poise > 0) {
          this.vx += p.dir * 40;
          return 'hit';
        }
        this.poise = this.poiseMax;
        this.stagger(1.3);
        K.fx.text(this.x, this.y - 190 * this.look.scale, 'SARSILDI!', '#ffcf6a', 22, 0.9);
        return 'hit';
      }
      this.interrupt();
      if (p.launch || !this.onGround || p.float || p.spike) {
        this.onGround = false;
        if (p.spike) this.vy = 1100;
        else if (p.launch) this.vy = -p.launch;
        else this.vy = -320;
        this.vx = p.dir * Math.min(p.kb, 260) * (p.launch ? 0.3 : 0.6);
        this.hardFall = p.knockdown || p.spike || this.hardFall;
        this.setState('air');
      } else if (p.knockdown) {
        this.vx = p.dir * p.kb;
        this.vy = -360;
        this.onGround = false;
        this.hardFall = true;
        this.setState('air');
      } else {
        this.vx = p.dir * p.kb;
        this.stunT = p.stun || 0.3;
        this.setState('hurt');
      }
      return 'hit';
    }
    interrupt() {
      this.move = null;
      this.releaseToken();
    }
    stagger(t) {
      this.interrupt();
      this.stunT = t;
      this.setState('stagger');
    }
    die(p) {
      this.dead = true;
      this.interrupt();
      this.hp = 0;
      this.vx = p.dir * Math.max(p.kb || 0, 320);
      this.vy = -460;
      this.onGround = false;
      this.deadT = 0;
      this.setState('dead');
      K.game.onKill(this);
    }

    // ---- Döngü ----
    update(dt) {
      this.st += dt;
      this.anim += dt;
      this.flash = Math.max(0, this.flash - dt);
      if (this.cd > 0) this.cd -= dt;
      const pl = this.player;
      const dx = pl.x - this.x;
      const adx = Math.abs(dx);
      let grav = 1;

      if (this.dead) {
        this.deadT += dt;
        if (this.onGround) this.vx = K.approach(this.vx, 0, 900 * dt);
        if (this.deadT > 2.2) this.remove = true;
      } else {
        switch (this.state) {
          case 'enter': {
            const b = K.game.bounds;
            this.facing = this.x < (b.min + b.max) / 2 ? 1 : -1;
            this.vx = this.facing * this.speed * 1.2;
            if (this.x > b.min + 40 && this.x < b.max - 40) this.setState('approach');
            break;
          }
          case 'approach':
            this.think(dt, dx, adx);
            break;
          case 'hurt':
            this.vx = K.approach(this.vx, 0, 1500 * dt);
            if (this.st > this.stunT) this.setState('approach');
            break;
          case 'stagger':
            this.vx = K.approach(this.vx, 0, 1500 * dt);
            if (this.st > this.stunT) this.setState('approach');
            break;
          case 'air':
            grav = this.vy < 0 ? 1 : 0.75;
            break;
          case 'down':
            this.vx = K.approach(this.vx, 0, 1500 * dt);
            if (this.st > 0.75) this.setState('getup');
            break;
          case 'getup':
            if (this.st > 0.4) this.setState('approach');
            break;
          default:
            if (this.move) this.runMove(dt, dx);
            break;
        }
      }

      if (!this.onGround || this.vy < 0) this.vy += K.GRAV * grav * dt;
      this.x += this.vx * dt;
      this.y += this.vy * dt;
      if (this.y >= K.GROUND) {
        this.y = K.GROUND;
        if (!this.onGround) {
          this.onGround = true;
          if (this.vy > 600) {
            K.fx.dust(this.x, K.GROUND, 8, 1.4);
            if (this.vy > 900) K.cam.shake(3, 0.06);
          }
          if (!this.dead && this.state === 'air') {
            this.setState(this.hardFall ? 'down' : 'approach');
            this.hardFall = false;
          }
        }
        this.vy = 0;
      } else if (this.y < K.GROUND - 0.5) this.onGround = false;
      if (this.state !== 'enter' && !this.dead) {
        const b = K.game.bounds;
        this.x = K.clamp(this.x, b.min + 20, b.max - 20);
      }
      this.computePose();
    }

    // Sıradan yeniçeri yapay zekâsı
    think(dt, dx, adx) {
      const G = K.game;
      const pl = this.player;
      this.facing = K.sign(dx);
      if (pl.dead) {
        this.vx = K.approach(this.vx, 0, 1000 * dt);
        return;
      }
      if (this.T.gunner) return this.thinkGunner(dt, dx, adx);
      const range = this.T.range;
      const wantAttack = this.cd <= 0 && (this.token || G.tokens < G.maxTokens);
      if (wantAttack) {
        if (adx < range) {
          if (!this.token) {
            this.token = true;
            G.tokens++;
          }
          this.startMove(this.T.moves.slash);
          return;
        }
        this.vx = K.approach(this.vx, this.facing * this.speed, 1800 * dt);
      } else {
        // Çevrede dolaş
        const want = pl.x - this.facing * this.ring;
        const diff = want - this.x;
        const sp = Math.abs(diff) > 20 ? K.sign(diff) * this.speed * 0.55 : 0;
        this.vx = K.approach(this.vx, sp + Math.sin(this.anim * 1.7 + this.jitter) * 30, 1200 * dt);
      }
    }
    thinkGunner(dt, dx, adx) {
      const G = K.game;
      if (adx < 90 && this.cd <= 0 && G.tokens < G.maxTokens + 1) {
        this.startMove(this.T.moves.slash);
        return;
      }
      const want = K.clamp(adx, 320, 560);
      const diff = adx - want;
      let sp = 0;
      if (Math.abs(diff) > 30) sp = diff > 0 ? this.facing * this.speed * 0.7 : -this.facing * this.speed * 0.8;
      this.vx = K.approach(this.vx, sp, 1200 * dt);
      if (this.cd <= 0 && adx < 760 && adx > 180) {
        this.startMove(AIMSHOT);
      }
    }

    // ---- Hamle yürütücü ----
    startMove(m) {
      this.move = m;
      this.moveHit = new Set();
      this.swung = false;
      this.setState('m_wind');
      if (m.onStart) m.onStart(this);
    }
    runMove(dt, dx) {
      const m = this.move;
      const s = this.state;
      const sp = this.speedMul || 1;
      if (s === 'm_wind') {
        this.vx = K.approach(this.vx, 0, 2000 * dt);
        if (m.track) this.facing = K.sign(dx);
        if (m.onWind) m.onWind(this, dt);
        if (this.st >= m.windup / sp) {
          this.setState('m_act');
          K.sfx(m.sfx || 'swing', 0.8);
          if (m.arc) {
            const sc = this.look.scale;
            K.fx.add({ type: 'arc', x: this.x + this.facing * 6 * sc, y: this.y - 92 * sc, dir: this.facing, a0: m.arc[0], a1: m.arc[1], r: m.arc[2] * sc, width: 9, life: 0.14, color: 'rgba(255,200,170,0.85)' });
          }
          if (m.onAct) m.onAct(this);
        }
      } else if (s === 'm_act') {
        if (m.lunge) this.vx = this.facing * m.lunge;
        if (m.dash) this.vx = this.facing * m.dash;
        if (m.onActive) m.onActive(this, dt);
        if (m.dmg && m.reach) {
          const sc = this.look.scale;
          const r = this.facing > 0
            ? { x: this.x - (m.back || 0) * sc, y: this.y + m.hy * sc, w: (m.reach + (m.back || 0)) * sc, h: m.hh * sc }
            : { x: this.x - m.reach * sc, y: this.y + m.hy * sc, w: (m.reach + (m.back || 0)) * sc, h: m.hh * sc };
          K.strike('enemy', r, { dmg: m.dmg, dir: this.facing, kb: m.kb, stun: m.stun, knockdown: m.knockdown, src: this }, this.moveHit);
        }
        if (this.st >= m.active) {
          this.setState('m_rec');
          if (m.onEnd) m.onEnd(this);
        }
      } else if (s === 'm_rec') {
        this.vx = K.approach(this.vx, 0, 2200 * dt);
        if (this.st >= m.recover / sp) {
          const next = m.next;
          this.releaseToken();
          if (next && !this.player.dead) {
            this.startMove(next);
            return;
          }
          this.move = null;
          this.cd = m.cd ? K.rand(m.cd[0], m.cd[1]) : K.rand(0.9, 1.9);
          this.setState('approach');
        }
      }
    }

    computePose() {
      const T = this.T;
      const base = this.basePose || T.base;
      let p = base;
      const t = this.st;
      const m = this.move;
      switch (this.state) {
        case 'enter':
        case 'approach':
          p = Math.abs(this.vx) > 25 ? K.runPose(this.anim * 11, base) : Object.assign({}, base, { bob: Math.sin(this.anim * 3) * 1.5 });
          if (Math.abs(this.vx) > 25 && K.sign(this.vx) !== this.facing) p.lean = -0.05;
          break;
        case 'm_wind':
          p = K.lerpPose(base, m.wind, K.ease(Math.min(1, t / (m.windup / (this.speedMul || 1)) * 1.4)));
          break;
        case 'm_act':
          p = K.lerpPose(m.wind, m.strike, Math.min(1, t / (Math.max(0.05, m.active) * 0.6)));
          break;
        case 'm_rec':
          p = K.lerpPose(m.strike, base, K.clamp(t / (m.recover / (this.speedMul || 1)), 0, 1) ** 2);
          break;
        case 'hurt':
        case 'stagger':
          p = P({ lean: -0.4, au: -0.4, af: 0.4, wa: -1.6, ft: 0.4, bt: -0.4, head: -0.3 });
          if (this.state === 'stagger') p.bob = 6 + Math.sin(this.anim * 12) * 2;
          break;
        case 'air':
          p = P({ lean: -0.3, au: 2.2, af: 2.6, wa: -1.8, ft: 0.6, fs: -0.4, bt: 0.2, bs: -0.6, rot: K.clamp(this.vy / 1800, -0.5, 0.6) - 0.4 });
          break;
        case 'down':
          p = P({ rot: -Math.PI / 2, lean: -0.2, au: 2.0, af: 2.4, wa: -2, ft: 0.3, bt: 0.1, bob: 8 });
          break;
        case 'getup':
          p = K.lerpPose(P({ rot: -Math.PI / 2, bob: 8 }), base, t / 0.4);
          break;
        case 'dead':
          p = P({ rot: this.onGround ? -Math.PI / 2 : -Math.PI / 2 * Math.min(1, this.deadT * 3), lean: -0.2, au: 2.4, af: 2.8, wa: -2.5, ft: 0.4, bt: 0.1, bob: 8, head: -0.4 });
          break;
      }
      this.pose = p;
    }
    glint() {
      if (this.state !== 'm_wind' || !this.move) return 0;
      const w = this.move.windup / (this.speedMul || 1);
      return this.st > w * 0.45 ? K.clamp((this.st - w * 0.45) / (w * 0.55), 0, 1) : 0;
    }
    rig(ctx) {
      const g = this.glint();
      const extra = { glint: g, glintLen: this.T.weapon === 'mizrak' ? 120 : 45, offhand: this.T.offhand, eyeGlow: this.dead ? 0 : this.isBoss ? Math.max(0.35, g) : g > 0.2 ? g : 0 };
      if (this.look.cape) extra.cape = { t: this.anim, v: Math.min(1, Math.abs(this.vx) / 500) };
      K.drawRig(ctx, this.x, this.y, this.facing, this.pose, this.look, this.dead ? null : this.weaponNow || this.T.weapon, this.flash > 0, extra);
    }
    get fadeAlpha() {
      return this.dead && this.deadT > 1.6 ? Math.max(0, 1 - (this.deadT - 1.6) / 0.6) : 1;
    }
    drawFx(ctx) {
      if (this.aimLine && !this.dead) this.drawAim(ctx);
    }
    overlay(ctx) {
      const s = this.look.scale;
      if (!this.isBoss && !this.dead && this.hp < this.maxHp && this.poiseMax === 0) {
        const w = 46, x = Math.round(this.x - w / 2), y = Math.round(this.y - 140 * s);
        ctx.fillStyle = 'rgba(12,6,10,0.85)';
        ctx.fillRect(x - 1, y - 1, w + 2, 6);
        ctx.fillStyle = '#c42a28';
        ctx.fillRect(x, y, Math.round((w * this.hp) / this.maxHp), 4);
        ctx.strokeStyle = 'rgba(201,162,74,0.7)';
        ctx.lineWidth = 1;
        ctx.strokeRect(x - 1.5, y - 1.5, w + 3, 7);
        ctx.fillStyle = '#c9a24a';
        ctx.beginPath();
        ctx.moveTo(x - 9, y + 2);
        ctx.lineTo(x - 5, y - 2);
        ctx.lineTo(x - 1, y + 2);
        ctx.lineTo(x - 5, y + 6);
        ctx.fill();
      }
    }
    drawAim(ctx) {
      const a = this.aimLine;
      ctx.strokeStyle = `rgba(255,70,50,${0.35 + a.k * 0.6})`;
      ctx.lineWidth = 3 + a.k * 3;
      ctx.setLineDash([10, 8]);
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(a.x + this.facing * 900, a.y);
      ctx.stroke();
      ctx.setLineDash([]);
    }
  }

  // Tüfekli nişan atışı
  const AIMSHOT = {
    windup: 0.9, active: 0.05, recover: 1.0, sfx: 'shot', cd: [2.6, 3.6],
    wind: AIM, strike: P({ lean: -0.15, au: 1.9, af: 2.1, wa: -0.4, ft: 0.3, bt: -0.4 }),
    onStart(e) { e.weaponNow = 'tufek'; },
    onWind(e, dt) {
      const s = e.look.scale;
      e.aimLine = { x: e.x + e.facing * 70 * s, y: e.y - 95 * s, k: e.st / (this.windup / (e.speedMul || 1)) };
    },
    onAct(e) {
      e.aimLine = null;
      fireEnemyBullet(e, 36);
    },
    onEnd(e) { e.aimLine = null; },
  };
  function fireEnemyBullet(e, dmg) {
    const s = e.look.scale;
    const x = e.x + e.facing * 80 * s, y = e.y - 95 * s;
    K.game.addProj(new Proj({ kind: 'ebullet', team: 'enemy', x, y, vx: e.facing * 1500, vy: 0, dmg, kb: 360, stun: 0.4, knockdown: true }));
    K.fx.smoke(x, y, e.facing, 10);
    K.fx.sparks(x, y, e.facing, 6, '#ffcf6a', 600);
    K.cam.shake(3, 0.08);
  }
  K.fireEnemyBullet = fireEnemyBullet;

  // ================= Kıdemliler =================
  const BOSSES = {};
  K.BOSSES = BOSSES;

  BOSSES.odabasi = {
    name: 'Odabaşı Deli Hüseyin', title: 'Kıdemli Yeniçeri', hp: 520, poise: 70, speed: 270, look: 'odabasi', weapon: 'yatagan', offhand: 'yatagan', base: P({ lean: 0.15, ft: 0.35, fs: 0.1, bt: -0.35, bs: -0.4, au: 0.6, af: 1.2, wa: -0.4, bu: 0.6, bf: 1.0, wb: -0.2 }),
    brain(e, dt, dx, adx) {
      if (e.cd > 0) {
        const want = K.game.player.x - e.facing * 200;
        e.vx = K.approach(e.vx, K.sign(want - e.x) * (Math.abs(want - e.x) > 30 ? e.speed * 0.6 : 0), 1500 * dt);
        return;
      }
      if (adx < 110) return e.startMove(e.moves.combo1);
      if (adx > 260 && Math.random() < 0.5) return e.startMove(e.moves.dash);
      e.vx = K.approach(e.vx, e.facing * e.speed, 2000 * dt);
    },
    moves() {
      const w = (x) => Object.assign({}, SLASH, x);
      const c3 = w({ windup: 0.2, dmg: 24, kb: 380, knockdown: true, lunge: 300, recover: 0.6, cd: [0.6, 1.2], wind: P({ lean: -0.1, au: 2.8, af: 3.0, wa: -2.0, bu: 2.8, bf: 3.0, wb: -2.0 }), strike: P({ lean: 0.45, au: 0.9, af: 0.5, wa: 0.8, bu: 0.9, bf: 0.5, wb: 0.8, ft: 0.7, fs: 0.3, bt: -0.6, bs: -0.7 }), arc: [-2.2, 1.0, 80] });

  <script>
/* ---- js/painter.js ---- */
'use strict';
// Karakter illüstrasyonları: her parça yüksek çözünürlükte (S kat) bir kez çizilir, sonra iskelete takılır.
// Kullanıcının resim dosyaları (assets/assets.js) varsa onlar önceliklidir.
(function (K) {
  const S = 4; // iskelet birimi başına piksel
  const PI = Math.PI;
  const sh = (c, f) => K.shade(c, f);

  function canvas(w, h) {
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.ceil(w));
    c.height = Math.max(1, Math.ceil(h));
    return c;
  }
  // Parça tuvali: a eklemi (0,0); b ucu verilen noktada. Sınırlar iskelet biriminde.
  function part(bounds, bEnd, draw) {
    const [wl, wr, top, bottom] = bounds, pad = 2;
    const c = canvas((wl + wr + pad * 2) * S, (top + bottom + pad * 2) * S);
    const g = c.getContext('2d');
    const ax = (wl + pad) * S, ay = (top + pad) * S;
    g.translate(ax, ay);
    g.scale(S, S);
    g.lineJoin = 'round';
    g.lineCap = 'round';
    draw(g);
    return { img: c, a: [ax, ay], b: [ax + bEnd[0] * S, ay + bEnd[1] * S], scale: 1 / S };
  }
  function darkened(p, amt) {
    const c = canvas(p.img.width, p.img.height);
    const g = c.getContext('2d');
    g.drawImage(p.img, 0, 0);
    g.globalCompositeOperation = 'source-atop';
    g.fillStyle = `rgba(10,6,22,${amt})`;
    g.fillRect(0, 0, c.width, c.height);
    return Object.assign({}, p, { img: c });
  }

  // ---------- Boyama yardımcıları ----------
  function cyl(g, x0, x1, base, lift = 1.18) {
    const gr = g.createLinearGradient(x0, 0, x1, 0);
    gr.addColorStop(0, sh(base, 0.4));
    gr.addColorStop(0.3, sh(base, 0.78));
    gr.addColorStop(0.64, sh(base, lift));
    gr.addColorStop(0.86, sh(base, 0.95));
    gr.addColorStop(1, sh(base, 0.55));
    return gr;
  }
  function vgr(g, y0, y1, a, b) {
    const gr = g.createLinearGradient(0, y0, 0, y1);
    gr.addColorStop(0, a);
    gr.addColorStop(1, b);
    return gr;
  }
  function limb(g, L, w0, w1, bulge = 0.6) {
    g.beginPath();
    g.moveTo(-w0 / 2, 0);
    g.quadraticCurveTo(-w0 / 2 - bulge, L * 0.45, -w1 / 2, L);
    g.arc(0, L, w1 / 2, PI, 0, true);
    g.quadraticCurveTo(w0 / 2 + bulge, L * 0.45, w0 / 2, 0);
    g.arc(0, 0, w0 / 2, 0, PI, true);
    g.closePath();
  }
  function ink(g, w = 0.45, col = '#0e0806') {
    w *= 0.75;
    g.lineWidth = w;
    g.strokeStyle = col;
    g.stroke();
  }
  function strokes(g, list, col, w) {
    g.strokeStyle = col;
    g.lineWidth = w;
    for (const s of list) {
      g.beginPath();
      g.moveTo(s[0], s[1]);
      if (s.length === 6) g.quadraticCurveTo(s[2], s[3], s[4], s[5]);
      else g.lineTo(s[2], s[3]);
      g.stroke();
    }
  }
  // Boya dokusu: şeklin içine ince ışık-gölge benekleri
  function grain(g, x, y, w, h, n = 120, seed = 1) {
    const r = K.seeded(seed);
    g.save();
    g.globalCompositeOperation = 'source-atop';
    for (let i = 0; i < n * 1.6; i++) {
      g.fillStyle = r() < 0.6 ? 'rgba(10,4,4,0.13)' : 'rgba(255,236,214,0.07)';
      g.fillRect(x + r() * w, y + r() * h, 0.35 + r() * 0.7, 0.25 + r() * 0.4);
    }
    // fırça darbeleri: kısa, eğik, düzensiz
    for (let i = 0; i < n * 0.5; i++) {
      const bx = x + r() * w, by = y + r() * h, a = -0.9 + r() * 0.5, l = 0.8 + r() * 2.4;
      g.strokeStyle = r() < 0.65 ? 'rgba(12,6,6,0.14)' : 'rgba(255,230,200,0.08)';
      g.lineWidth = 0.3 + r() * 0.4;
      g.beginPath();
      g.moveTo(bx, by);
      g.lineTo(bx + Math.cos(a) * l, by + Math.sin(a) * l);
      g.stroke();
    }
    // alt kısım kirli ve koyu
    const dg = g.createLinearGradient(0, y + h * 0.55, 0, y + h);
    dg.addColorStop(0, 'rgba(14,6,6,0)');
    dg.addColorStop(1, 'rgba(14,6,6,0.32)');
    g.fillStyle = dg;
    g.fillRect(x, y, w, h);
    g.restore();
  }
  // Altın işleme: bir çizgi boyunca küçük motifler
  function embroidery(g, x0, y0, x1, y1, col, w = 1.1) {
    g.strokeStyle = sh(col, 0.65);
    g.lineWidth = w + 0.5;
    g.beginPath();
    g.moveTo(x0, y0);
    g.lineTo(x1, y1);
    g.stroke();
    g.strokeStyle = col;
    g.lineWidth = w;
    g.stroke();
    const n = Math.max(2, Math.round(Math.hypot(x1 - x0, y1 - y0) / 2.2));
    g.fillStyle = sh(col, 1.35);
    for (let i = 0; i <= n; i++) {
      const t = i / n;
      g.beginPath();
      g.arc(x0 + (x1 - x0) * t, y0 + (y1 - y0) * t, w * 0.32, 0, PI * 2);
      g.fill();
    }

    g.scale(rx / Math.max(rx, ry), ry / Math.max(rx, ry));
    g.translate(-x, -y);

  function hat(g, L) {

  function cape(L) {
    const len = L.capeLen || 62;
    return part([22, 12, 4, len + 6], [0, len], g => {
      const path = () => {
        g.beginPath();
        g.moveTo(-3, -2);
        g.lineTo(8, -1);
        g.quadraticCurveTo(10, len * 0.5, 8, len);
        for (let i = 0; i < 6; i++) g.lineTo(8 - i * 4.5 - 2.2, len + (i % 2 ? -3.4 : 1.6));
        g.lineTo(-18, len - 2);
        g.quadraticCurveTo(-14, len * 0.45, -3, -2);
        g.closePath();
      };
      path();
      g.fillStyle = cyl(g, -18, 9, L.cape, 1.35);
      g.fill();
      grain(g, -20, -2, 30, len + 4, 160, 23);
      strokes(g, [[-2, 6, -6, len * 0.5, -10, len - 4], [3, 6, 2, len * 0.5, 0, len - 2], [-8, len * 0.3, -12, len * 0.6, -15, len - 3]], sh(L.cape, 0.55), 0.7);
      strokes(g, [[1, 8, 0.4, len * 0.5, -2, len - 4]], 'rgba(255,200,180,0.12)', 1.2);
      g.beginPath();
      g.moveTo(-3, -2);
      g.quadraticCurveTo(-14, len * 0.45, -18, len - 2);
      g.strokeStyle = L.capeLining;
      g.lineWidth = 1.4;
      g.stroke();
      path();
      ink(g, 0.5);
      if (L.capeFur) {
        g.beginPath();
        g.ellipse(1, 0, 12, 4.6, 0, 0, PI * 2);
        g.fillStyle = cyl(g, -11, 13, L.capeFur, 1.3);
        g.fill();
        furStrokes(g, -10, -4, 22, 8, L.capeFur, 29);
      }
    });
  }

  function shield() {
    return part([19, 19, 19, 19], [0, 17], g => {
      g.beginPath();
      g.arc(0, 0, 17, 0, PI * 2);
      const gr = g.createRadialGradient(4, -5, 2, 0, 0, 17);
      gr.addColorStop(0, '#9a6a3a');
      gr.addColorStop(1, '#4a2e18');
      g.fillStyle = gr;
      g.fill();
      for (let i = 0; i < 16; i++) {
        const a = (i / 16) * PI * 2;
        strokes(g, [[Math.cos(a) * 6, Math.sin(a) * 6, Math.cos(a) * 15, Math.sin(a) * 15]], 'rgba(30,16,8,0.4)', 0.35);
      }
      g.beginPath();
      g.arc(0, 0, 16.4, 0, PI * 2);
      g.strokeStyle = '#c9a24a';
      g.lineWidth = 1.6;
      g.stroke();
      g.fillStyle = '#e0c070';
      for (let i = 0; i < 12; i++) {
        const a = (i / 12) * PI * 2;
        g.beginPath();
        g.arc(Math.cos(a) * 13.6, Math.sin(a) * 13.6, 0.7, 0, PI * 2);
        g.fill();
      }
      g.beginPath();
      g.arc(0, 0, 4.6, 0, PI * 2);
      const bg = g.createRadialGradient(1.5, -1.5, 0.5, 0, 0, 4.6);
      bg.addColorStop(0, '#fff0c0');
      bg.addColorStop(1, '#8a6a2a');
      g.fillStyle = bg;
      g.fill();
      g.beginPath();
      g.arc(0, 0, 17, 0, PI * 2);
      ink(g, 0.5);
    });
  }

      g.fillStyle = cyl(g, -15, -8, '#c9a24a', 1.4);
      g.fillRect(-15, -4.4, 7, 7.4);
      g.fillStyle = '#2a2c32';
      g.fillRect(-14, -7, 2.4, 3);
      for (const x of [16, 44, 70]) {
        g.fillStyle = '#c9a24a';
        g.fillRect(x, -3.4, 1.6, 4.4);
      }
    }),
    tabanca: () => part([12, 32, 8, 14], [28, 0], g => {
      g.beginPath();
      g.moveTo(-4, -3);
      g.lineTo(5, -3);
      g.quadraticCurveTo(-1, 6, -4, 12.4);
      g.lineTo(-10.6, 11.4);
      g.quadraticCurveTo(-6, 4, -4, -3);
      g.closePath();
      g.fillStyle = cyl(g, -11, 5, '#7a4a2a', 1.3);
      g.fill();
      ink(g, 0.35);
      g.fillStyle = '#d8b060';
      g.beginPath();
      g.arc(-8.6, 11.4, 2.2, 0, PI * 2);
      g.fill();
      g.fillStyle = vgr(g, -5.4, -1.4, '#8a8e96', '#2a2c32');
      g.fillRect(-1, -5.4, 29, 4.2);
      g.fillStyle = '#c9a24a';
      g.fillRect(-2, -6.2, 6, 6);
      g.fillRect(26, -5.8, 2, 5);
      g.fillStyle = '#2a2c32';
      g.fillRect(-3.4, -8.4, 2.2, 3);
    }),
    cirit: () => part([36, 80, 6, 6], [76, 0], g => {
      g.fillStyle = vgr(g, -1.6, 1.6, '#b08a5a', '#6a4a2a');
      g.fillRect(-34, -1.5, 96, 3);
      for (const x of [-20, 30]) {
        g.fillStyle = '#a8262b';
        g.fillRect(x, -1.8, 5, 3.6);
      }
      g.beginPath();
      g.moveTo(60, -3.4);
      g.lineTo(77, 0);
      g.lineTo(60, 3.4);
      g.closePath();
      g.fillStyle = steel(g, -3.4, 3.4);
      g.fill();
      ink(g, 0.3, '#2a3038');
    }),
    topuz: () => part([12, 74, 16, 16], [69, 0], g => {
      g.fillStyle = vgr(g, -2.4, 2.4, '#8a6040', '#3a2414');
      g.fillRect(-9, -2.4, 52, 4.8);
      g.fillStyle = '#c9a24a';
      g.fillRect(36, -3, 4, 6);
      for (let i = 0; i < 8; i++) {
        const a = (i / 8) * PI * 2;
        g.beginPath();
        g.moveTo(56 + Math.cos(a - 0.3) * 6, Math.sin(a - 0.3) * 6);
        g.lineTo(56 + Math.cos(a) * 14, Math.sin(a) * 14);
        g.lineTo(56 + Math.cos(a + 0.3) * 6, Math.sin(a + 0.3) * 6);
        g.closePath();
        g.fillStyle = steel(g, -14, 14);
        g.fill();
        ink(g, 0.3, '#2a3038');
      }
      g.beginPath();
      g.arc(56, 0, 8, 0, PI * 2);
      const bg = g.createRadialGradient(59, -3, 1, 56, 0, 8);
      bg.addColorStop(0, '#e8eef2');
      bg.addColorStop(1, '#4a5260');
      g.fillStyle = bg;
      g.fill();
      ink(g, 0.35, '#2a3038');
    }),
  };

  // ---------- Bütün karakterleri hazırla ----------
  K.paint = {
    S,
    bakeAll() {
      const weapons = {};
      for (const k in WEAPONS) weapons[k] = WEAPONS[k]();
      const shieldPart = shield();
      for (const name in K.LOOKS) {
        if (K.assets.hasUser(name)) continue;
        const L = K.LOOKS[name];
        const ua = upperArm(L), fa = foreArm(L), th = thigh(L), sn = shin(L);
        const parts = {
          torso: torso(L),
          head: head(L),
          skirt: skirt(L),
          upperArmF: ua,
          foreArmF: fa,
          upperArmB: darkened(ua, 0.38),
          foreArmB: darkened(fa, 0.38),
          thighF: th,
          shinF: sn,
          thighB: darkened(th, 0.38),
          shinB: darkened(sn, 0.38),
        };
        if (L.cape) parts.cape = cape(L);
        if (L.shield) parts.shield = shieldPart;
        K.assets.setChar(name, parts, weapons);
      }
    },
  };
})(window.K);

/* ---- js/level.js ---- */
'use strict';
// Bölüm I: İstanbul'dan çıkış. Çarpışmalar sırayla gelir; her biri kilitli bir arenadır.
(function (K) {
  // Yeniçeri sayısı tam 100: dalgalar 86 + tüfekçibaşının 4 muhafızı + bayraktarın 4 çağrısı + ağanın 6 çağrısı
  const ENC = [
    { type: 'wave', label: 'Dalga 1', n: 8, max: 5, tokens: 2, mix: { kilicli: 1 } },
    { type: 'wave', label: 'Dalga 2', n: 12, max: 6, tokens: 2, mix: { kilicli: 0.8, tufekli: 0.2 } },
    { type: 'boss', key: 'odabasi' },
    { type: 'wave', label: 'Dalga 3', n: 12, max: 6, tokens: 2, mix: { kilicli: 0.6, mizrakli: 0.25, tufekli: 0.15 } },
    { type: 'wave', label: 'Dalga 4', n: 14, max: 7, tokens: 3, mix: { kilicli: 0.5, mizrakli: 0.3, tufekli: 0.2 } },
    { type: 'boss', key: 'tufekcibasi', escorts: ['kilicli', 'kilicli', 'mizrakli', 'kilicli'] },
    { type: 'wave', label: 'Dalga 5', n: 14, max: 7, tokens: 3, mix: { kilicli: 0.45, mizrakli: 0.25, tufekli: 0.15, kalkanli: 0.15 } },
    { type: 'boss', key: 'topuzcu' },
    { type: 'wave', label: 'Dalga 6', n: 14, max: 8, tokens: 3, mix: { kilicli: 0.4, mizrakli: 0.25, tufekli: 0.15, kalkanli: 0.2 } },
    { type: 'boss', key: 'bayraktar' },
    { type: 'wave', label: 'Dalga 7', n: 12, max: 8, tokens: 3, mix: { kilicli: 0.35, mizrakli: 0.25, tufekli: 0.2, kalkanli: 0.2 } },
    { type: 'boss', key: 'aga', final: true },
  ];
  K.ENC = ENC;
  K.TOTAL_WAVES = ENC.filter(e => e.type === 'wave').length;
  K.arenaLeft = i => i * 1600;
  K.LEVEL_END = K.arenaLeft(ENC.length - 1) + K.W;
  K.GATE_X = K.arenaLeft(ENC.length - 1) + 940;

  function pickType(mix) {
    let r = Math.random(), acc = 0;
    for (const k in mix) {
      acc += mix[k];
      if (r <= acc) return k;
    }
    return Object.keys(mix)[0];
  }

  class Encounter {
    constructor(i) {
      this.i = i;
      this.def = ENC[i];
      this.left = K.arenaLeft(i);
      this.right = this.left + K.W;
      this.spawned = 0;
      this.spawnT = 0.6;
      this.pending = [];
      this.pendT = 0;
      this.done = false;
      this.boss = null;
    }
    start() {
      const G = K.game, d = this.def;
      G.bounds = { min: this.left, max: this.right };
      G.maxTokens = d.tokens || 2;
      G.tokens = 0;
      if (d.type === 'wave') {
        G.banner = { text: d.label.toUpperCase(), sub: `${d.n} yeniçeri`, t: 0, dur: 2 };
        K.sfx('horn');
      } else {
        const B = K.BOSSES[d.key];
        this.boss = new K.Boss(d.key, this.right + 80);
        G.enemies.push(this.boss);
        G.maxTokens = 2;
        G.banner = { text: B.name, sub: B.title, t: 0, dur: 2.6, boss: true };
        if (d.escorts) this.pending.push(...d.escorts);
        K.sfx('horn');
      }
    }
    summon(types) {
      this.pending.push(...types);
    }
    spawnGrunt(type) {
      const side = Math.random() < 0.5 ? -1 : 1;
      const x = side < 0 ? this.left - K.rand(60, 160) : this.right + K.rand(60, 160);
      K.game.enemies.push(new K.Enemy(type, x));
    }
    alive() {
      return K.game.enemies.filter(e => !e.dead).length;
    }
    update(dt) {
      if (this.done) return;
      const d = this.def;
      if (this.pending.length) {
        this.pendT -= dt;
        if (this.pendT <= 0) {
          this.spawnGrunt(this.pending.shift());
          this.pendT = 0.3;
        }
      }
      if (d.type === 'wave' && this.spawned < d.n) {
        const alive = this.alive();
        if (alive < d.max) {
          this.spawnT -= dt;
          if (this.spawnT <= 0) {
            this.spawnGrunt(pickType(d.mix));
            this.spawned++;
            this.spawnT = K.rand(0.3, 0.75);
          }
        }
      }
      const waveDone = d.type === 'wave' ? this.spawned >= d.n : this.boss && this.boss.dead;
      if (waveDone && !this.pending.length && this.alive() === 0) this.finish();
    }
    finish() {
      this.done = true;
      K.game.onEncounterDone(this);
    }
  }
  K.Encounter = Encounter;
})(window.K);
